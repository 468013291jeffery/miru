<iframe id="f" src="/index.html" style="width:400px;height:600px"></iframe>
<script>
setTimeout(function(){
  var w=document.getElementById('f').contentWindow,o=document.getElementById('out'),L=[];
  ['C','W','S','ch','first','PK_C','PACK_C'].forEach(function(k){ L.push(k+': '+typeof w[k]) });
  try{ var ck=w.C?Object.keys(w.C).slice(0,5):[]; L.push('C keys: '+ck.join(',')) }catch(e){ L.push('C keys err') }

},9000);
</script>
