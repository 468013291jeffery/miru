/* MIRU 安卓壳（TWA：可信网页壳）—— 打开的就是线上的 https://www.miru.plus，网站更新 = App 自动更新。
   版本号：GitHub Actions 每次构建自动 +1（VERSION_CODE = 构建序号），不用手改。
   签名：上传密钥从环境变量读（GitHub Secrets → 工作流写进来），仓库里不放任何密钥。 */
plugins { id 'com.android.application' }
def vcode = (System.getenv('VERSION_CODE') ?: '1').toInteger()
android {
    namespace 'com.miru.plus.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.miru.plus.app'
        minSdk 23
        targetSdk 36
        versionCode vcode
        versionName "1.0.${vcode}"
    }
    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_PATH')
            if (ks) { storeFile file(ks); storePassword System.getenv('KEYSTORE_PASSWORD'); keyAlias System.getenv('KEY_ALIAS'); keyPassword System.getenv('KEY_PASSWORD') }
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'com.google.androidbrowserhelper:billing:1.0.0-alpha11'
}
