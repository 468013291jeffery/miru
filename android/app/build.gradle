/* MIRU 安卓壳（TWA：可信网页壳）—— 打开的就是线上的 https://www.miru.plus，网站更新 = App 自动更新。
   版本号：GitHub Actions 每次构建自动 +1（VERSION_CODE = 构建序号），不用手改。
   签名：上传密钥从环境变量读（GitHub Secrets → 工作流写进来），仓库里不放任何密钥。
   minSdk 24：Google Play「自动保护」要求最低 24。 */
plugins { id 'com.android.application' }
def vcode = (System.getenv('VERSION_CODE') ?: '1').toInteger()
/* 广告：Unity Ads（2026-11-24 改为直接接 Unity；之前的聚合平台不再接受新的发布者账号）。
   Game ID 不是密钥，直接写在这里；广告位用 Unity 后台默认的 Rewarded_Android / Interstitial_Android，可用环境变量覆盖。
   UNITY_TEST=1 时用测试广告。
   2026-11-28：Unity 后台新建了广告位，ID 是 BP_Rewarded_Android / BP_Interstitial_Android（之前写的默认名在后台根本不存在，所以一直「广告加载中」）。
   App 还在内测 / 封测，Unity 条款不允许给还没上线的 App 放真实广告（会被判作弊封号），所以默认用测试广告；
   正式上架后在 GitHub Secrets / 工作流里设 UNITY_TEST=0 切真实广告。 */
def unityGame = System.getenv('UNITY_GAME_ID') ?: '800450584'
def unityRewarded = System.getenv('UNITY_REWARDED_ID') ?: 'BP_Rewarded_Android'
def unityLaunch = System.getenv('UNITY_LAUNCH_ID') ?: 'BP_Interstitial_Android'
def unityTest = (System.getenv('UNITY_TEST') ?: '1') != '0'
/* 2026-11-28 渠道包：play（上传 Google Play，用 Play 结算）和 aptoide（上传 Aptoide，以及它分发到的 APKPure 等渠道；Aptoide 规定内购必须用它的结算 SDK）。
   aptoide 包多一个 AptoidePayActivity 和 Aptoide 结算 SDK；play 包里完全没有 Aptoide 的代码。
   Aptoide 公钥不是密钥（Aptoide 后台「Public Key」，本来就是放进 App 里的），可以用环境变量 APTOIDE_PUBLIC_KEY 覆盖。 */
def aptoideKey = System.getenv('APTOIDE_PUBLIC_KEY') ?: ''
android {
    namespace 'com.miru.plus.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.miru.plus.app'
        minSdk 24
        targetSdk 36
        versionCode vcode
        versionName "1.0.${vcode}"
        buildConfigField "String", "UNITY_GAME_ID", "\"${unityGame}\""
        buildConfigField "String", "UNITY_REWARDED", "\"${unityRewarded}\""
        buildConfigField "String", "UNITY_LAUNCH", "\"${unityLaunch}\""
        buildConfigField "boolean", "UNITY_TEST", "${unityTest}"
    }
    buildFeatures { buildConfig true }
    flavorDimensions 'store'
    productFlavors {
        play { dimension 'store'; buildConfigField "String", "STORE", '"play"' }
        aptoide { dimension 'store'; buildConfigField "String", "STORE", '"aptoide"'; buildConfigField "String", "APTOIDE_PUBLIC_KEY", "\"${aptoideKey}\"" }
    }
    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_PATH')
            if (ks) { storeFile file(ks); storePassword System.getenv('KEYSTORE_PASSWORD'); keyAlias System.getenv('KEY_ALIAS'); keyPassword System.getenv('KEY_PASSWORD') }
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'com.google.androidbrowserhelper:billing:1.2.0'   // Play 结算库 8.x（Play 要求 ≥ 8.0.0）
    implementation 'com.unity3d.ads:unity-ads:4.16.1'                 // Unity Ads
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    aptoideImplementation 'com.aptoide:android-aptoide-billing:1.5.0'  // Aptoide 结算 SDK（只进 aptoide 渠道包）
}
