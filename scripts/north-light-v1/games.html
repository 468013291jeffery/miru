<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北灯未熄 互动行动</title>
<style>
:root{color-scheme:dark;--bg:#101923;--panel:#172431;--line:#354554;--ink:#f3f1ea;--muted:#b8c6d2;--gold:#e8bd7d;--good:#95d6b5;--bad:#f3a29b}*{box-sizing:border-box}body{margin:0;font:16px/1.7 system-ui,-apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--ink)}header{padding:28px 5vw 20px;border-bottom:1px solid var(--line)}h1{font-size:26px;margin:0 0 8px}h2{font-size:24px;margin:8px 0 12px}h3{font-size:17px;margin:18px 0 8px}p{margin:8px 0}small,.muted{color:var(--muted)}.layout{max-width:1260px;margin:auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:30px;padding:24px}.nav{display:flex;flex-direction:column;gap:7px}.nav button{text-align:left;font-size:14px}.nav button.active{border-color:var(--gold);background:#3a3027}.nav em{float:right;color:var(--good);font-style:normal}.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}.quote{border-left:3px solid var(--gold);padding-left:14px;margin:16px 0;color:#f5d7aa}.clue{padding:12px 14px;background:#0e1b26;border-radius:8px;margin:8px 0;white-space:pre-line}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}button{font:inherit;color:var(--ink);border:1px solid #526475;border-radius:9px;padding:9px 14px;background:#223443;cursor:pointer;max-width:100%;text-align:left}button:hover{border-color:var(--gold)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button.primary{background:var(--gold);color:#1c2227;font-weight:700;border-color:var(--gold)}button.chosen{background:#475543;border-color:var(--good)}button:disabled{opacity:.45;cursor:default}.controls{display:grid;gap:9px}.controls button{width:100%}.feedback{margin-top:18px;padding:14px;background:#202b34;border-radius:9px;white-space:pre-line}.result{border-color:var(--good)}label{display:block;margin:10px 0}input,textarea,select{font:inherit;width:100%;padding:10px;color:var(--ink);background:#0e1b26;border:1px solid #526475;border-radius:8px}textarea{min-height:90px;resize:vertical}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.badge{font-size:13px;border:1px solid var(--line);border-radius:20px;padding:3px 10px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}details{margin-top:20px;color:var(--muted)}summary{cursor:pointer;color:var(--gold)}ol{padding-left:25px}footer{padding:24px 5vw;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}@media(max-width:760px){.layout{display:block;padding:16px}.nav{flex-direction:row;overflow-x:auto;padding-bottom:12px;margin-bottom:12px}.nav button{min-width:160px;flex:none}.box{padding:18px}.pair{grid-template-columns:1fr}header{padding:20px}h1{font-size:22px}h2{font-size:21px}.toolbar button{flex:1}body{font-size:15px}}
</style>
<header><h1>北灯未熄 · 互动行动</h1><p>你的名字被写进死亡名单，旧凭据却还在替你发令。先亲手拆开这些谜题，再决定要听谁解释。</p><small>每题是对应场景的独立试读，可任选、重试或跳过。完整人物对白与剧情分支见配套剧本；在剧情中完成行动后，结果会写入当前存档。</small></header>
<div class="layout"><nav class="nav" id="nav" aria-label="选择玩法"></nav><main class="box" id="main"></main></div><footer>所有人物与事件为原创虚构。从剧情进入时，真实结果会回传当前场景。输赢不判定爱情、身份或生存资格。</footer>
<script>
'use strict';
const order=['G01','G02','G03','G04','G05','G06','G09','G07','G08'];
const info={G01:['第一章','哪两份能证明你是谁','诺亚：先让她以活人的身份说话。','把旧身份与近期活动连起来，选两份能交叉核对的凭据。'],G02:['第一章','三格电撬开一扇门','伊莱：别只听那份假声音，先看电往哪儿走。','门2格，滑轨2格，灯1格，总共3格。门升起且灯亮，才能固定支架；固定后可断门电。'],G03:['第二章','听见第二声再动','隔板后，两个人各拿半张维修卡，谁也看不见全部。','黄灯亮不能接；第二声短响可试接；白针归零才能锁。提问和填写暗号不推进信号。'],G04:['第二章','四轮旧物交换','伊莱：票我可以输。让你记住我这件事，我还想争一下。','最多四次出价。伊莱用旅行票换含“车轮”和“天气”的即兴；诺亚用棋换具体自述或修棋角；玛拉用地图换修好夹扣。'],G05:['第三章','六条记录，两个矛盾','诺亚：别只留下我把人救回来的那一页。','先把六张记录排回时间顺序，再标出两项与原始记录不符的结论。'],G06:['第四章','谁在借用你的签名','伊莱：十二条命不能替你原谅我。','对照日期、声音与凭据，分别判断能证明什么；不能凭声纹认定本人现场发令。'],G09:['第五章','三轮公开拆招','海伦：你们接手，就把以后的损失也写清。','三轮各选一份最相关的证据。有效反驳至少两轮取得公共广播；未达成也保留公共核查与必要资产。'],G07:['第六章','六格电，三项测试','玛拉：别因为喜欢谁的主张，就把另一条路涂掉。','每轮6格：主网A=2，灯列B=3，附站C=4。两轮内各完成一次，轮末释放电；基础生活另供。'],G08:['第七章','四个人都要走出来','诺亚：什么时候关，你说。','先稳住门，将超限箱移到外侧滑台，撤出并核对四人，最后在外部闭锁。还有备用维修梯。']};
const states={},receipts={};let current='G01';
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function state(){return states[current]||(states[current]={step:0,errors:0,sel:[],issues:[],msg:'',power:{door:false,rail:false,light:false},fixed:false,open:false,round:0,done:[],deals:[],owners:{ticket:'伊莱',chess:'诺亚',map:'玛拉'},object:'ticket',offer:'improv',value:'',actor:'诺亚',signal:'',answers:['','',''],score:0});}
function btn(act,text,val='',cls=''){return `<button type="button" data-act="${act}" data-v="${esc(val)}" class="${cls}">${esc(text)}</button>`;}
function chosen(act,text,val,yes){return btn(act,text,val,yes?'chosen':'');}
function commit(result,detail,memory){if(receipts[current])return;receipts[current]={result,detail,memory};state().msg='';paint();}
function wrong(message,max=2){let g=state();g.errors++;g.msg=message;if(g.errors>=max){const fallback={G02:['工班交缓存摘要，原始波形附页未保留；海伦收到追查警报。','LOG=summary，HELEN_ALERT=true，不封锁后续核查。'],G05:['核查组提供正确时间轴，仍可当面质询诺亚。','记录纠错经历，救援不抵销封门和归责。'],G06:['核查组公开旧录音、旧凭据与转交记录，伊莱仍承担责任。','必要真相已交付，不记录玩家亲手完成证据链。'],G07:['工班补齐三项测试，必要结果全部公开。','TEST=ABC，执行者为工班；不封锁生存路线。']}[current]||['转入剧本中的补救路径，必要信息与基本生活保留。','本题未成功，不写成亲手完成。'];commit('LOSE',message+'\n'+fallback[0],fallback[1]);}else paint();}
function paint(){const g=state(),[chapter,title,quote,rule]=info[current],r=receipts[current];$('#nav').innerHTML=order.map(id=>`<button data-act="nav" data-v="${id}" class="${id===current?'active':''}"><small>${info[id][0]} · ${id}</small><br>${info[id][1]}${receipts[id]?'<em>'+({WIN:'✓',LOSE:'↪',SKIP:'—'}[receipts[id].result])+'</em>':''}</button>`).join('');
let body=`<span class="badge">${chapter} · ${current}</span><h2>${title}</h2><div class="quote">${quote}</div><p>${rule}</p>`;
if(r){body+=`<section class="clue result"><h3>${{WIN:'成功',LOSE:'转入补救',SKIP:'本次跳过'}[r.result]}</h3><p>${esc(r.detail)}</p><p class="muted">记忆与后续：${esc(r.memory)}</p></section>`;}else body+=gameBody(g);
if(g.msg&&!r)body+=`<div class="feedback" role="status">${esc(g.msg)}</div>`;
body+=`<div class="toolbar">${!r?btn('skip','这次不玩'):''}${btn('reset','重新试这题')}${btn('next','下一题')}</div><details><summary>这题如何回到故事里</summary><p>${esc(carry(current))}</p></details><p class="muted">已留结果 ${Object.keys(receipts).length}/9。仅记录本次操作，不自动生成恋爱、原谅或身体接触。</p>`;$('#main').innerHTML=body;}
function carry(id){return {G01:'身份事实核验不等于必须接受担保。第二章所有路径都会取得独立凭证，担保解除。',G02:'完整日志或摘要、海伦是否提前察觉，会改变后续取证措辞；没有附页仍有公开核查渠道。',G03:'只保存实际选择的搭档和真正提出的暗号，第七章可回响；不因一起修好就恋爱。',G04:'只记真实成交和转赠后的物主。后文不能把玩家已经拿走的票、棋又塞回NPC口袋。',G05:'诺亚的错误不会因为成功救援被抹去，原件公开与交权都要真实发生。',G06:'交易解释了十二名病人怎样入所，不替女主作原谅；旧录音和旧凭据不是另一个女主。',G09:'公开广播或本地监督操作会在下一场和第七章改变调度方式，不消失在一个好感数字里。',G07:'全部必要测试在终局前仍可完成。先测谁只影响合作经历，不替玩家选生存路线或恋人。',G08:'成功保全箱与四人；失败改走维修梯丢非必要箱，仍保住人和核心方案。'}[id];}
function gameBody(g){switch(current){case'G01':return `<div class="controls">${[['A','A 旧工程证：P7编号，右角双点刻痕'],['B','B 昨日工单：P7编号，独立接收回执和记录匣校验码'],['C','C 十二天前死亡登记：海伦据断联签发，无遗体或现场确认']].map(([v,t])=>chosen('select',t,v,g.sel.includes(v))).join('')}</div><div class="row">${btn('submit','提交两份材料','','primary')}</div>`;
case'G02':{let p=g.power,load=2*p.door+2*p.rail+p.light;return `<div class="clue">当前 ${load}/3格\n门：${g.fixed?'机械固定':g.open?'已升起，尚未固定':'关闭'} · 灯：${p.light?'亮':'灭'} · 滑轨：${p.rail?'供电':'停机'}\n错误尝试 ${g.errors}/2</div><div class="row">${chosen('power','门 2格','door',p.door)}${chosen('power','滑轨 2格','rail',p.rail)}${chosen('power','灯 1格','light',p.light)}</div><div class="row">${btn('fix','装上机械支架')}${btn('take','取出日志匣','','primary')}</div>`;}
case'G03':return `<label>选仪表搭档<select id="actor">${['诺亚','伊莱'].map(n=>`<option ${g.actor===n?'selected':''}>${n}</option>`).join('')}</select></label><label>可选：这次实际约定的暗号<input id="signal" value="${esc(g.signal)}" placeholder="可以不填，不会自动补出一个"></label><div class="clue">${['第一拍：黄灯亮，第一声短响，白针2','第二拍：黄灯灭，第二声短响，白针1','第三拍：黄灯灭，白针0'][g.step]}</div><div class="row">${btn('beat','等待','wait')}${btn('beat','试接','try')}${btn('beat','锁定','lock')}</div>`;
case'G04':return `<div class="clue">已出价 ${g.round}/4轮\n旅行票：${g.owners.ticket} · 缺角棋：${g.owners.chess} · 地图副本：${g.owners.map}</div><label>想换哪件<select id="object">${[['ticket','旅行票'],['chess','缺角棋'],['map','地图副本']].map(([v,n])=>`<option value="${v}" ${g.object===v?'selected':''}>${n}</option>`).join('')}</select></label><label>拿什么交换<select id="offer">${[['improv','即兴播报（含车轮、天气）'],['truth','一件自愿分享的具体小事'],['repair','修理动作']].map(([v,n])=>`<option value="${v}" ${g.offer===v?'selected':''}>${n}</option>`).join('')}</select></label><label>你的内容或动作<textarea id="value" placeholder="修棋角：对齐拼角并固定；修地图夹：弹片入槽">${esc(g.value)}</textarea></label><div class="row">${btn('bid','正式出价','','primary')}${btn('finish','结束交换')}</div>${g.deals.length?`<label>把已得物件赠给<select id="recipient"><option>玛拉</option><option>诺亚</option><option>伊莱</option></select></label><div class="row">${g.deals.filter(x=>g.owners[x]==='玩家').map(x=>btn('give','转赠'+({ticket:'旅行票',chess:'缺角棋',map:'地图'}[x]),x)).join('')}</div>`:''}`;
case'G05':{const cards=['① 21:10 供能估计可撑12分','② 21:12 诺亚命封门','③ 21:16 诺亚折返救援','④ 次日09:00 签主责归玩家的报告','⑤ 次日14:00 女主外派','⑥ 半年后注销人，却仍使用旧授权'];if(g.step===0)return `<p>按先后点六张卡；点错可撤一步。</p><div class="controls">${[3,0,5,2,4,1].map(i=>`<button data-act="card" data-v="${i}" ${g.sel.includes(i)?'disabled':''}>${cards[i]}</button>`).join('')}</div><div class="clue">当前顺序：${g.sel.map(i=>i+1).join(' → ')||'未选择'}</div><div class="row">${btn('undo','撤一步')}${btn('submit','核对顺序','','primary')}</div>`;return `<p>标出两项问题。</p><div class="controls">${['尚有人未撤出便封门','救援成功就撤销前后责任','外派不能被当成死亡确认'].map((t,i)=>chosen('issue',t,String(i),g.issues.includes(i))).join('')}</div><div class="row">${btn('submit','提交两处判断','','primary')}</div>`;}
case'G06':return `<div class="clue">三十天前：旧片转交凭条，换12名病人名额。\n十二天前：海伦据断联注销身份。\n今天：旧片校验通过，广播发令。\n旧录音：我批准〔三次金属敲声〕将备用电转入北线检修。\n今日广播：我批准〔同样三次敲声〕将备用电转入北线〔剪接并重复〕。</div>${[['凭据校验能证明什么',['女主今天同意','旧凭据被使用','出现两个女主']],['同样的敲声和剪接证明什么',['旧录音素材被重用','女主在现场说话','灯塔能读心']],['交易与接纳记录说明什么',['救人后便不存在责任','十二名病人刚刚新增到252之外','伊莱未获同意转交片，名额给了已在原240内的病人']]].map(([q,opts],i)=>`<label>${q}<select data-answer="${i}"><option value="">请选择</option>${opts.map((v,j)=>`<option value="${j}" ${g.answers[i]===String(j)?'selected':''}>${v}</option>`).join('')}</select></label>`).join('')}<div class="row">${btn('submit','核对证据链','','primary')}</div>`;
case'G09':return `<div class="clue">第${g.step+1}/3轮\n海伦：“${['那段批准证明她今天已经同意。','这列车原本只能带二十四人。','居民没有提出公开要求。'][g.step]}”</div><div class="controls">${[['A 旧工单、原始片段和今日调用时间',0],['B 三节车厢铭牌，各90座，仅证明座位',1],['C 居民共同核查请求，仅证明要求公开',2]].map(([t,v])=>btn('evidence',t,String(v))).join('')}</div><p>已有效反驳 ${g.score} 轮</p>`;
case'G07':return `<div class="clue">第${g.round+1}轮 · 已完成 ${g.done.join('、')||'无'}\n本轮已选电量 ${g.sel.reduce((n,x)=>n+({A:2,B:3,C:4}[x]),0)}/6格</div><div class="row">${[['A','主网 A 2格'],['B','灯列 B 3格'],['C','附站 C 4格']].map(([v,t])=>chosen('select',t,v,g.sel.includes(v))).join('')}</div><div class="row">${btn('run','执行本轮测试','','primary')}</div>`;
case'G08':return `<div class="clue">${['门未固定；四人在作业区，箱挡通道。','门已撑稳；箱仍在内，四人未撤。','箱已到外侧回收滑台；可清点撤出。','四张位置牌已核对在外；等待外部闭锁。'][g.step]}\n${g.step<3?'作业区：诺亚、伊莱、玛拉、维修员':'外侧安全区：诺亚、伊莱、玛拉、维修员'}</div><div class="controls">${[['brace','撑稳门'],['unload','把箱移到外侧回收滑台'],['count','逐一撤出并核对四人'],['close','从外部远端闭锁'],['leave','让一个人留在舱内守开关']].map(([v,t])=>btn('relay',t,v)).join('')}</div>`;
}}
function toggle(arr,v){const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1);}
function action(a,v){let g=state();if(a==='nav'){current=v;paint();return;}if(a==='reset'){delete states[current];delete receipts[current];paint();return;}if(a==='next'){current=order[(order.indexOf(current)+1)%order.length];paint();return;}if(a==='skip'){const endings={G01:'由公共核验补证，第二章独立凭证照常取得。',G02:'维修组交缓存摘要；没有原始波形附页。',G03:'工班完成校准，没有玩家成功协作或暗号记忆。',G04:'没有成交，地图必要线索仍公开。',G05:'核查组公开时间轴，玩家仍可当面质询。',G06:'公共核查交付证据链，伊莱仍承担交易责任。',G09:'居民接管必要资产；之后从本地台执行授权。',G07:'工班完成全部必要测试，三路线保持可选。',G08:'执行组按安全程序转运四人和箱，不算玩家亲手操作。'};commit('SKIP',endings[current],'跳过游戏，不生成恋爱或成功操作记忆。');return;}if(receipts[current])return;
if(a==='select'){toggle(g.sel,v);paint();return;}
if(current==='G01'&&a==='submit'){if(g.sel.length!==2){g.msg='请选两份材料。';paint();return;}if(g.sel.includes('A')&&g.sel.includes('B'))commit('WIN','灯塔：旧编号和近期回执对应，死亡登记与事实冲突。','身份事实核验AB成功；独立凭证在第二章签发，担保解除。');else commit('LOSE',g.sel.includes('A')?'旧身份有了，还缺近期独立回执B。转公共补证。':'近期活动有了，还缺旧身份原始凭据A。转公共补证。','临时核验，基本接纳保留；第二章取得独立凭证。');return;}
if(current==='G02'){if(a==='power'){let p={...g.power,[v]:!g.power[v]};if(2*p.door+2*p.rail+p.light>3){wrong('超出3格，未送电。先断开不需要的一路。');return;}if(v==='rail'&&p.rail&&!g.fixed){wrong('门还没机械固定，防夹回退。先撑住门。');return;}if(v==='door'&&!p.door&&g.open&&!g.fixed){g.power=p;g.open=false;wrong('未固定就断门电，门回落，进入保护。');return;}g.power=p;if(p.door)g.open=true;g.msg='回路已更新。';paint();return;}if(a==='fix'){if(g.open&&g.power.light){g.fixed=true;g.msg='支架已锁，门电可以撤掉。';paint();}else wrong('只有门升起并且灯亮，才能看清支架卡槽。');return;}if(a==='take'){if(g.fixed&&g.power.rail&&g.power.light)commit('WIN','伊莱：对，把两格借出来，日志到了。','取得原件与波形附页；记录真实固定、换路操作。');else wrong('还不能取匣：需要固定门、滑轨供电与照明。');return;}}
if(current==='G03'&&a==='beat'){const expected=['wait','try','lock'][g.step];if(v!==expected){commit('LOSE','校准回退，搭档补修。黄灯不能接，必须先试接再锁。','没有成功暗号；保留真实搭档与这次返工经历，不扣爱情。');return;}g.step++;if(g.step===3)commit('WIN',g.actor+'：这次我听完你的口令了。','实际搭档：'+g.actor+'；'+(g.signal.trim()?'双方使用暗号：'+g.signal.trim():'未约定暗号，不自动补造。'));else{g.msg='这一步完成，等待下一拍。';paint();}return;}
if(current==='G04'){if(a==='bid'){if(g.deals.includes(g.object)){g.msg='这件已成交，不在本场重新挂牌。';paint();return;}g.round++;let ok=g.object==='ticket'?g.offer==='improv'&&g.value.includes('车轮')&&g.value.includes('天气'):g.object==='chess'?(g.offer==='truth'&&g.value.trim().length>=2)||(g.offer==='repair'&&g.value.includes('拼角')&&g.value.includes('固定')):g.offer==='repair'&&g.value.includes('弹片')&&g.value.includes('入槽');if(ok){g.deals.push(g.object);g.owners[g.object]='玩家';g.msg='成交。只记录你实际输入的自述或动作，不推断你的感情。';}else g.msg='对方提出反报价：'+({ticket:'播报里还需同时有“车轮”和“天气”。',chess:'需要一件自愿自述，或把拼角对齐并固定。',map:'夹扣仍松，把弹片放回卡槽。'}[g.object]);if(g.round>=4){commit(g.deals.length?'WIN':'LOSE','四轮结束，成交'+g.deals.length+'件。','真实物主：'+JSON.stringify(g.owners));return;}paint();return;}if(a==='finish'){commit(g.deals.length?'WIN':'LOSE',g.deals.length?'按已成交物件结束交换。':'没有成交，可以普通借看地图。','真实物主：'+JSON.stringify(g.owners));return;}if(a==='give'){if(g.owners[v]==='玩家'){g.owners[v]=$('#recipient').value;g.msg='已按你的选择转赠，不会在后文自动收回。';paint();}return;}}
if(current==='G05'){if(a==='card'){if(!g.sel.includes(Number(v)))g.sel.push(Number(v));paint();return;}if(a==='undo'){g.sel.pop();paint();return;}if(a==='issue'){toggle(g.issues,Number(v));paint();return;}if(a==='submit'){if(g.step===0){if(g.sel.length!==6){g.msg='六张记录都需排入，可以撤一步。';paint();return;}if(g.sel.join(',')==='0,1,2,3,4,5'){g.step=1;g.msg='顺序成立，再找两处问题。';paint();}else wrong('时间不成立。救援在封门之后，归责在翌日，外派不是死亡。');}else if(g.issues.length===2&&g.issues.includes(0)&&g.issues.includes(2))commit('WIN','诺亚：都交，不只留下救回人的那页。','完整旧案证据链，救援不抵销封门与推责。');else wrong('救援发生在错误之后，不取消责任。找“撤完”与“死亡依据”的两处矛盾。');return;}}
if(current==='G06'&&a==='submit'){if(g.answers.some(x=>x==='')){g.msg='三项判断都需要选择。';paint();return;}if(g.answers.join(',')==='1,0,2')commit('WIN','灯塔：旧片认证，旧录音剪接，管理端调用；不是另一个女主。','伊莱未经同意转片的责任成立；12名病人已包含原240。');else wrong('声纹不证明本人现场发令；救人不能取消未经同意的交易。核对三项各自能证明什么。');return;}
if(current==='G09'&&a==='evidence'){let ok=Number(v)===g.step;if(ok)g.score++;g.msg=ok?'对应证据拆掉了这一项说法。':'材料不对应这项说法，海伦抓住了缺口；证据不会被销毁。';g.step++;if(g.step===3)commit(g.score>=2?'WIN':'LOSE',g.score>=2?'居民接管仓库与公共广播，海伦不再独占发令。':'必要资产仍公开；广播需从本地台受监督执行。','有效反驳 '+g.score+'/3，后章读取调度方式。');else paint();return;}
if(current==='G07'&&a==='run'){let cost=g.sel.reduce((n,x)=>n+({A:2,B:3,C:4}[x]),0);if(!g.sel.length){g.msg='先选本轮测试。';paint();return;}if(cost>6){wrong('本轮要'+cost+'格，只有6格，未接通。基础供电不受影响。');return;}g.round++;for(let x of g.sel)if(!g.done.includes(x))g.done.push(x);g.sel=[];if(g.done.length===3){commit(g.round<=2?'WIN':'LOSE','三项测试全部完成，必要结果一起公开。',g.round<=2?'两轮内完成；先测顺序只改变合作经历。':'补测完成，不封锁任何路线。');return;}if(g.round>=3){commit('LOSE','三轮后由工班补齐未测项，三方案事实照常公开。','未亲自完成全部测试，不自动锁定偏好路线。');return;}g.msg=g.round===2?'仍缺项目，开放第三轮补测。':'本轮完成，电量释放，下一轮仍有6格。';paint();return;}
if(current==='G08'&&a==='relay'){let ex=['brace','unload','count','close'][g.step];if(v!==ex){wrong(({unload:'门没撑稳，先装支架。',close:'人未撤全，保护拒绝闭锁。',leave:'有外部闭锁端，不需要留人当开关。',count:'通道仍被箱堵住，先把箱移到外侧滑台。',brace:'支架已有，不重复做同一步。'})[v]||'步骤不成立。');if(receipts[current]){receipts[current].detail='改走维修梯，四人和桥芯安全，箱留作业区，非必要扩展设备丢失。';receipts[current].memory='BOX=丢失，核心方案继续；不能在尾声补造扩展件。';paint();}return;}g.step++;if(g.step===4)commit('WIN','四人全部撤出，箱已在外侧，远端闭锁完成。','BOX=保全；诺亚等完口令，只有真实暗号才能回忆。');else{g.msg='位置反馈已更新，继续下一步。';paint();}return;}}
document.addEventListener('click',e=>{let b=e.target.closest('button[data-act]');if(b)action(b.dataset.act,b.dataset.v);});document.addEventListener('input',e=>{let g=state();if(['signal','value'].includes(e.target.id))g[e.target.id]=e.target.value;});document.addEventListener('change',e=>{let g=state();if(['actor','object','offer'].includes(e.target.id))g[e.target.id]=e.target.value;if(e.target.dataset.answer!==undefined)g.answers[Number(e.target.dataset.answer)]=e.target.value;});
window.NorthLight={open(id){if(!info[id])throw Error('Unknown game');current=id;paint();},reset(){delete states[current];delete receipts[current];paint();},snapshot(){return JSON.parse(JSON.stringify({current,states,receipts}));}};paint();

const bridge=new URLSearchParams(location.search),locked=bridge.get('game');
if(locked&&info[locked]){current=locked;const originalPaint=paint;paint=function(){originalPaint();document.querySelector('.nav').style.display='none';document.querySelectorAll('[data-act="next"],[data-act="reset"]').forEach(b=>b.remove());document.querySelector('.layout').style.display='block';const actor=document.querySelector('#actor');if(actor&&bridge.get('actor')){actor.value=bridge.get('actor');state().actor=actor.value;actor.disabled=true;}};
const originalAction=action;action=function(a,v){if(['nav','next','reset'].includes(a))return;originalAction(a,v);if(receipts[locked])parent.postMessage({type:'northlight-receipt',nonce:bridge.get('nonce'),game:locked,receipt:receipts[locked],state:states[locked]},location.origin);};paint();}
</script></html>
