<!doctype html><meta charset="utf-8"><title>MIRU 互动特效预览</title><link rel="stylesheet" href="effects.css"><style>body{background:#18141e;color:white;font:18px sans-serif;text-align:center}#stage{position:relative;margin:20px auto;width:270px;height:480px;background:linear-gradient(#332333,#121923);overflow:hidden}button{padding:10px;margin:5px}</style><h1>互动特效预览</h1><div id="stage"><p>选择按钮查看效果</p><div class="miru-fx" id="fx"></div></div><div id="buttons"></div><script>for(const [id,label] of Object.entries({evidence:'证据揭露',warmth:'心动暖光',danger:'危险警示',victory:'反击成功',choice:'选择确认',message:'消息提醒'})){let b=document.createElement('button');b.textContent=label;b.onclick=()=>{let f=document.querySelector('#fx');f.classList.remove('play');void f.offsetWidth;f.style.backgroundImage=`url(${id}.svg)`;f.classList.add('play')};document.querySelector('#buttons').append(b)}</script>
