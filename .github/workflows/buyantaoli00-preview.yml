name: Miru branch preview build

on:
  push:
    branches: [codex/buyantaoli00-work]
    paths:
      - 'source/**'
      - 'art/**'
      - 'audio/**'
      - '.github/workflows/buyantaoli00-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miru-buyantaoli00-preview
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/codex/buyantaoli00-work'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/buyantaoli00-work
      - name: Build the complete MIRU product from this branch
        run: python3 source/build.py
      - name: Commit generated files only to the test branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html miru_rules.js api/_rules.js source/src/content_36.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build: refresh MIRU test-branch artifacts'
          git push origin HEAD:refs/heads/codex/buyantaoli00-work
