name: build-index
on:
  push:
    branches: [main]
    paths: ['source/**', 'art/**', 'audio/**', 'video/**', 'tools/**', 'ops/**', '.github/workflows/build-index.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-index
  cancel-in-progress: false
jobs:
  script-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/script-style-check.mjs
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild from current main on every push attempt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            # This is an ephemeral CI checkout. Never rebase an old generated HTML file.
            git reset --hard origin/main
            python3 source/build.py
            node --check source/all.js
            node tools/release-contract.mjs
            node tools/catalog-selftest.cjs
            node tools/role-list-selftest.cjs
            python3 tools/deploy-guard-selftest.py
            git add index.html
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'build: regenerate index from current main'
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'main advanced repeatedly; no generated file was force-pushed' >&2
          exit 1
