# 构建 Google Play 上传用的 .aab（2026-11-05）
# 触发：手动（Actions → Android App → Run workflow），或 android/ 目录有改动时自动跑。
# 需要在仓库 Settings → Secrets and variables → Actions 里加 secret（只加一次）：
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD（ANDROID_KEYSTORE_PASSWORD 可选，不填就用 KEY_PASSWORD）
# 跑完在这次运行的页面底部下载 miru-release-aab，里面的 app-release.aab 就是传到 Play Console 的文件。
name: Android App
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Write keystore
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: |
          if [ -z "$KS" ]; then echo "::error::还没在 GitHub Secrets 里加 ANDROID_KEYSTORE_BASE64"; exit 1; fi
          echo "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build release bundle
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: miru-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
