# 构建 Google Play 上传用的 .aab（2026-11-05）
# 触发：手动（Actions → Android App → Run workflow），或 android/ 目录有改动时自动跑。
# 需要的 secret：ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD（ANDROID_KEYSTORE_PASSWORD 可选，不填就用 KEY_PASSWORD）
# 广告（可选）：APPLOVIN_SDK_KEY / APPLOVIN_REWARDED_ID / APPLOVIN_APPOPEN_ID —— 不填就构建一个没有广告的版本
# 跑完在这次运行的页面底部下载 miru-release-aab，里面的 app-release.aab 就是传到 Play Console 的文件。
name: Android App
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK 36（运行器自带 SDK，只补装平台 36）
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '8.11.1' }
      - name: Write keystore
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: |
          if [ -z "$KS" ]; then echo "::error::还没在 GitHub Secrets 里加 ANDROID_KEYSTORE_BASE64"; exit 1; fi
          echo "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build release bundle
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APPLOVIN_SDK_KEY: ${{ secrets.APPLOVIN_SDK_KEY }}
          APPLOVIN_REWARDED_ID: ${{ secrets.APPLOVIN_REWARDED_ID }}
          APPLOVIN_APPOPEN_ID: ${{ secrets.APPLOVIN_APPOPEN_ID }}
        run: gradle :app:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v5
        with:
          name: miru-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
      # 同一个 .aab 再推到 builds 分支（只放这一个文件，强制覆盖），这样能用固定地址直接取到文件上传 Play Console，不用解压 artifact
      - name: Publish AAB to builds branch
        run: |
          mkdir -p "$RUNNER_TEMP/out" && cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/"
          echo "versionCode ${{ github.run_number }}" > "$RUNNER_TEMP/out/VERSION.txt"
          cd "$RUNNER_TEMP/out" && git init -q && git checkout -q -b builds && git add . \
            && git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' commit -qm "aab build ${{ github.run_number }}" \
            && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
