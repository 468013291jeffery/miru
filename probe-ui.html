<!doctype html><meta charset="utf-8"><title>ui probe3</title>
<pre id="out">running…</pre>
<script>
fetch('/.browser-save.json').then(r=>r.text()).then(txt=>{
  let data=txt; try{const j=JSON.parse(txt); data=j&&j.value?(typeof j.value==='string'?j.value:JSON.stringify(j.value)):txt}catch(_){}
  try{localStorage.setItem('miru_v2',data)}catch(e){}
  const f=document.createElement('iframe'); f.src='/index.html'; f.style.cssText='width:420px;height:760px;border:0';
  document.body.appendChild(f);
  setTimeout(()=>{
    const w=f.contentWindow, out=document.getElementById('out'), L=[];
    if(!w||!w.__ui){out.textContent='no __ui';return}
    try{ w.renderChat() }catch(e){ L.push('render 抛错: '+e.message) }
    const s=w.__ui(true);
    L.push('调度已装: '+w.UI.__dispatchInstalled+' · 安装错误: '+(w.__uiErr||'(无)'));
    L.push('hook 数: '+s.汇总.hook数+' · 总失败: '+s.汇总.总失败);
    L.push('— 每个钩子 —');
    (s.钩子||[]).forEach(h=>L.push('  '+h.名字.padEnd(14)+' 跑'+h.执行+' 失败'+h.失败));
    if((s.最近错误||[]).length){ L.push('— 最近错误 —'); (s.最近错误).forEach(e=>L.push('  '+e.hook+': '+e.msg)) }
    out.textContent=L.join('\n');
  },12000);
});
</script>
