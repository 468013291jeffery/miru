<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIRU 运营后台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.8.4/dist/index.css">
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/element-plus@2.8.4/dist/index.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/element-plus@2.8.4/dist/locale/zh-cn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="/miru_rules.js"></script>
<style>
:root{--side:#14121a;--brand:#EE6F97}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;background:#f4f5f7;color:#1f2329}
[v-cloak]{display:none}
.login-wrap{min-height:100%;display:grid;place-items:center;background:radial-gradient(60% 50% at 20% 0%,#ffe1ea,transparent 70%),radial-gradient(50% 50% at 100% 100%,#e9e2ff,transparent 70%),#f7f7fa}
.login-card{width:380px;max-width:92vw}.login-card h1{margin:0 0 4px;font-size:22px}.brand{font-weight:800;letter-spacing:4px}.brand b{color:var(--brand)}
.layout{height:100vh}
.aside{background:var(--side);color:#cfcbd8;overflow-y:auto;transition:width .2s}
.aside .logo{height:56px;display:flex;align-items:center;gap:8px;padding:0 20px;color:#fff;font-size:18px;white-space:nowrap;overflow:hidden}
.aside .el-menu{border-right:0;background:transparent}.aside .el-menu-item,.aside .el-sub-menu__title{color:#cfcbd8}
.aside .el-menu-item.is-active{color:#fff;background:#2a2533}.aside .el-menu-item:hover,.aside .el-sub-menu__title:hover{background:#221e2a}
.aside .el-sub-menu .el-menu{background:#100e15}
.header{background:#fff;border-bottom:1px solid #e8e9ec;display:flex;align-items:center;gap:12px;height:56px}
.header .title{font-size:16px;font-weight:600;flex:1}
.main{padding:16px;overflow-y:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:12px}
.kpi{background:#fff;border-radius:10px;padding:14px 16px;border:1px solid #eceef1}.kpi .l{font-size:12px;color:#8a8f99}.kpi .v{font-size:24px;font-weight:700;margin-top:4px}.kpi .s{font-size:12px;color:#8a8f99;margin-top:2px}
.kpi.warn .v{color:#e6a23c}.kpi.alert .v{color:#f56c6c}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.panel{background:#fff;border-radius:10px;border:1px solid #eceef1;padding:14px 16px;margin-bottom:12px}.panel h3{margin:0 0 10px;font-size:15px}
.chart{height:280px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.pager{display:flex;justify-content:flex-end;margin-top:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.muted{color:#8a8f99;font-size:12px}
.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.asset{background:#fff;border:1px solid #eceef1;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.asset .pv{height:150px;background:#111;display:grid;place-items:center}.asset .pv img,.asset .pv video{max-width:100%;max-height:150px}
.asset .bd{padding:10px;font-size:13px;flex:1}.asset .ft{padding:8px 10px;border-top:1px solid #f0f0f2;display:flex;gap:6px;flex-wrap:wrap}
.el-menu-item .el-badge{margin-left:8px;line-height:1}.el-menu-item .el-badge__content.is-fixed{position:static;transform:none}
.chap{border-left:3px solid #f0b77e;padding:6px 10px;margin:8px 0;background:#fafafa;border-radius:4px}
.beat{font-size:12px;color:#555;margin:2px 0}
pre.json{white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto;background:#f6f7f9;padding:8px;border-radius:6px;font-size:12px;margin:0}
.el-descriptions__label{width:110px}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="root-tpl"><div>
  <!-- ========== sign in ========== -->
  <div v-if="!token" class="login-wrap">
    <el-card class="login-card" shadow="always">
      <h1><span class="brand">MI<b>RU</b></span> 运营后台</h1>
      <p class="muted" style="margin:0 0 18px">管理员登录</p>
      <el-form @submit.prevent="login" label-position="top">
        <el-form-item label="用户名"><el-input v-model="lf.username" autocomplete="username" placeholder="admin" /></el-form-item>
        <el-form-item label="密码"><el-input v-model="lf.password" type="password" show-password autocomplete="current-password" @keyup.enter="login" /></el-form-item>
        <el-button type="primary" style="width:100%" :loading="busy" @click="login">登录</el-button>
      </el-form>
      <p class="muted" style="margin-top:14px">首次使用：用户名 <b>admin</b>，密码为部署时设置的 ADMIN_KEY。登录后请立即在右上角修改密码，并为同事创建各自的账号。</p>
    </el-card>
  </div>

  <!-- ========== console ========== -->
  <el-container v-else class="layout">
    <el-aside :width="collapsed?'64px':'220px'" class="aside">
      <div class="logo"><span class="brand">MI<b>RU</b></span><span v-if="!collapsed" style="font-size:13px;color:#9a93a8">运营后台</span></div>
      <el-menu :default-active="route" :collapse="collapsed" @select="go" :default-openeds="['content','money','ops','sys']">
        <el-menu-item index="dashboard" v-if="can('dashboard')"><el-icon><DataAnalysis /></el-icon><template #title>数据看板</template></el-menu-item>
        <el-menu-item index="studio" v-if="can('scripts')"><el-icon><EditPen /></el-icon><template #title>剧本生产</template></el-menu-item>
        <el-menu-item index="users" v-if="can('users')"><el-icon><User /></el-icon><template #title>用户管理</template></el-menu-item>
        <el-sub-menu index="content" v-if="can('works')||can('assets')||can('reports')">
          <template #title><el-icon><Checked /></el-icon><span>内容审核</span></template>
          <el-menu-item index="works" v-if="can('works')">作品审核 <el-badge v-if="badge.works" :value="badge.works" class="ml" /></el-menu-item>
          <el-menu-item index="assets" v-if="can('assets')">素材审核 <el-badge v-if="badge.assets" :value="badge.assets" /></el-menu-item>
          <el-menu-item index="reports" v-if="can('reports')">举报处理 <el-badge v-if="badge.reports" :value="badge.reports" /></el-menu-item>
        </el-sub-menu>
        <el-sub-menu index="money" v-if="can('orders')||can('ledger')">
          <template #title><el-icon><Wallet /></el-icon><span>订单与钻石</span></template>
          <el-menu-item index="orders" v-if="can('orders')">充值订单</el-menu-item>
          <el-menu-item index="ledger" v-if="can('ledger')">钻石流水</el-menu-item>
        </el-sub-menu>
        <el-sub-menu index="ops" v-if="can('notices')||can('i18n')||can('config')||can('events')">
          <template #title><el-icon><Promotion /></el-icon><span>运营工具</span></template>
          <el-menu-item index="notices" v-if="can('notices')">公告管理</el-menu-item>
          <el-menu-item index="events" v-if="can('events')">行为数据</el-menu-item>
          <el-menu-item index="i18n" v-if="can('i18n')">多语言词条</el-menu-item>
          <el-menu-item index="config" v-if="can('config')">系统配置</el-menu-item>
        </el-sub-menu>
        <el-sub-menu index="sys" v-if="can('admins')||can('audit')">
          <template #title><el-icon><Setting /></el-icon><span>系统管理</span></template>
          <el-menu-item index="admins" v-if="can('admins')">管理员与权限</el-menu-item>
          <el-menu-item index="audit" v-if="can('audit')">操作日志</el-menu-item>
        </el-sub-menu>
      </el-menu>
    </el-aside>
    <el-container>
      <el-header class="header">
        <el-button text @click="collapsed=!collapsed"><el-icon size="18"><Fold v-if="!collapsed"/><Expand v-else/></el-icon></el-button>
        <div class="title">{{ titles[route] || '' }}</div>
        <el-tag v-if="payTest" type="warning" effect="plain">支付为测试模式</el-tag>
        <el-dropdown @command="cmd">
          <span style="cursor:pointer;display:flex;align-items:center;gap:6px"><el-avatar :size="28" style="background:#EE6F97">{{ (me.name||me.username||'?').slice(0,1) }}</el-avatar>{{ me.name || me.username }} <el-tag size="small">{{ roleName[me.role] }}</el-tag></span>
          <template #dropdown><el-dropdown-menu><el-dropdown-item command="pw">修改密码</el-dropdown-item><el-dropdown-item command="out" divided>退出登录</el-dropdown-item></el-dropdown-menu></template>
        </el-dropdown>
      </el-header>
      <el-main class="main">
        <component :is="'p-'+route" :key="route+'-'+reloadKey" />
      </el-main>
    </el-container>
  </el-container>

  <el-dialog v-model="pwDlg" title="修改密码" width="380px">
    <el-form label-width="80px"><el-form-item label="原密码"><el-input v-model="pw.old" type="password" show-password /></el-form-item><el-form-item label="新密码"><el-input v-model="pw.password" type="password" show-password placeholder="至少 8 位" /></el-form-item></el-form>
    <template #footer><el-button @click="pwDlg=false">取消</el-button><el-button type="primary" @click="changePw">保存</el-button></template>
  </el-dialog>
</div></script>
<script>
const { createApp, reactive, ref, computed, onMounted, nextTick, watch, h } = Vue;
const { ElMessage, ElMessageBox } = ElementPlus;
const S = reactive({ token: localStorage.getItem('miru_admin_tok') || '', me: JSON.parse(localStorage.getItem('miru_admin_me') || '{}'), perms: JSON.parse(localStorage.getItem('miru_admin_perms') || '[]') });
async function api(r, opt) {
  opt = opt || {}; const qs = new URLSearchParams(Object.assign({ r }, Object.fromEntries(Object.entries(opt.query || {}).filter(([, v]) => v !== '' && v != null)))).toString();
  const res = await fetch('/api/admin?' + qs, { method: opt.body ? 'POST' : 'GET', headers: Object.assign({ 'Content-Type': 'application/json' }, S.token ? { Authorization: 'Bearer ' + S.token } : {}), body: opt.body ? JSON.stringify(opt.body) : undefined });
  let j = {}; try { j = await res.json(); } catch (_) {}
  if (res.status === 401 && r !== 'login' && r !== 'password') { logout(); ElMessage.error('登录已过期，请重新登录'); throw new Error('401'); }
  if (!res.ok) { ElMessage.error(j.error || ('请求失败 ' + res.status)); throw new Error(j.error || res.status); }
  return j;
}
function logout() { S.token = ''; localStorage.removeItem('miru_admin_tok'); }
const can = p => S.perms.includes('*') || S.perms.includes(p);
const fmt = t => t ? new Date(t).toLocaleString('zh-CN', { hour12: false }) : '—';
const fmtD = t => t ? new Date(t).toLocaleDateString('zh-CN') : '—';
const money = c => '$' + ((c || 0) / 100).toFixed(2);
const size = b => !b ? '—' : b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.round(b / 1024) + ' KB';
const L = {
  role: { owner: '超级管理员', admin: '管理员', reviewer: '审核员', writer: '编剧', support: '客服', analyst: '数据分析' },
  roleDesc: { owner: '全部权限，含管理员账号管理', admin: '除管理员账号外的全部权限', reviewer: '作品 / 素材审核、举报处理', support: '用户管理、补发钻石（单次 ±500）、订单', analyst: '只读：数据看板、行为数据、订单', writer: '剧本生产工作台（生成、审改；上线需审核通过）' },
  provider: { guest: '游客', email: '邮箱', google: 'Google', apple: 'Apple' },
  ustatus: { active: '正常', banned: '已封禁', deleted: '已注销' },
  wstatus: { pending: '待审核', live: '已上线', rejected: '已驳回', takedown: '已下架', removed: '作者已删除' },
  astatus: { review: '待审核', public: '已公开', private: '仅作者', rejected: '已驳回', removed: '已删除' },
  rstatus: { open: '待处理', resolved: '已处理', dismissed: '已驳回' },
  kind: { bgm: '背景音乐', sfx: '音效', fx: '特效', mg: '小游戏' },
  ostatus: { paid: '已支付', refunded: '已退款' },
  action: { login: '登录后台', change_password: '修改密码', gems_grant: '补发钻石', gems_deduct: '扣除钻石', user_ban: '封禁用户', user_unban: '解封用户', user_reset_password: '重置用户密码', user_force_logout: '强制下线', user_note: '修改备注', user_rename: '修改昵称', user_email: '修改邮箱', work_approve: '作品通过', work_reject: '作品驳回', work_takedown: '作品下架', work_restore: '作品恢复', work_feature: '设为推荐', work_unfeature: '取消推荐', work_delete: '删除作品', asset_approve: '素材公开', asset_reject: '素材驳回', asset_private: '素材设为私有', asset_delete: '删除素材', report_resolve: '处理举报', report_dismiss: '驳回举报', order_refund: '订单退款', i18n_edit: '修改词条', i18n_delete: '删除词条', i18n_add: '新增词条', config_update: '修改配置', notice_create: '新建公告', notice_update: '修改公告', notice_delete: '删除公告', admin_create: '新建管理员', admin_update: '修改管理员', admin_enable: '启用管理员', admin_disable: '停用管理员', admin_reset_password: '重置管理员密码', admin_delete: '删除管理员', script_create: '新建剧本', script_save: '保存剧本', script_restore: '恢复剧本版本', script_publish: '剧本上线', script_unpublish: '剧本下线', script_delete: '删除剧本' },
  event: { app_open: '打开 App', auth_view: '看到登录页', login: '登录 / 注册', taste_done: '完成口味选择', hook_play: '播放引子短剧', story_start: '开始故事', chapter_done: '完成一章', talk: '自由对话', store_open: '打开商店', purchase: '充值', publish: '发布作品', register: '注册', upload: '上传素材', community_open: '打开社区' },
};
const tagType = s => ({ active: 'success', live: 'success', public: 'success', paid: 'success', resolved: 'success', pending: 'warning', review: 'warning', open: 'warning', banned: 'danger', rejected: 'danger', takedown: 'danger', refunded: 'info', deleted: 'info', private: 'info', dismissed: 'info', removed: 'info' }[s] || 'primary');

/* ---------- reusable: paged list ---------- */
function usePaged(route, filters, after) {
  const st = reactive({ rows: [], total: 0, page: 1, size: 20, loading: false, extra: {} });
  async function load(p) { if (p) st.page = p; st.loading = true; try { const j = await api(route, { query: Object.assign({ page: st.page, size: st.size }, filters) }); st.rows = j.rows || []; st.total = j.total || 0; st.extra = j; after && after(j); } finally { st.loading = false; } }
  return { st, load };
}
async function promptText(title, label, opt) { const { value } = await ElMessageBox.prompt(label, title, Object.assign({ confirmButtonText: '确定', cancelButtonText: '取消', inputValidator: v => !!(v && v.trim()) || '必填' }, opt || {})); return value.trim(); }
function chart(el, option) { if (!el) return; const c = echarts.getInstanceByDom(el) || echarts.init(el); c.setOption(option, true); window.addEventListener('resize', () => c.resize()); }

/* ================= pages ================= */
const Dashboard = {
  setup() {
    const d = ref(null), c1 = ref(), c2 = ref(), c3 = ref(), c4 = ref();
    async function load() {
      d.value = await api('dashboard'); window.__payTest.value = d.value.payTest; await nextTick();
      const s = d.value.series, days = s.map(x => fmtD(x.day).slice(5));
      chart(c1.value, { tooltip: { trigger: 'axis' }, legend: { data: ['新增用户', '日活 DAU'] }, grid: { left: 40, right: 20, top: 40, bottom: 30 }, xAxis: { type: 'category', data: days }, yAxis: { type: 'value', minInterval: 1 }, series: [{ name: '新增用户', type: 'line', smooth: true, data: s.map(x => x.new_users), color: '#EE6F97' }, { name: '日活 DAU', type: 'line', smooth: true, data: s.map(x => x.dau), color: '#7b6ad8' }] });
      chart(c2.value, { tooltip: { trigger: 'axis' }, legend: { data: ['钻石消耗', '收入 (USD)'] }, grid: { left: 50, right: 50, top: 40, bottom: 30 }, xAxis: { type: 'category', data: days }, yAxis: [{ type: 'value', name: '💎' }, { type: 'value', name: '$' }], series: [{ name: '钻石消耗', type: 'bar', data: s.map(x => x.gems_spent), color: '#F0B77E' }, { name: '收入 (USD)', type: 'line', yAxisIndex: 1, data: s.map(x => x.revenue / 100), color: '#67c23a' }] });
      const f = d.value.funnel.filter(x => x.users > 0 || ['app_open', 'login', 'story_start', 'purchase'].includes(x.name));
      chart(c3.value, { tooltip: { formatter: p => p.name + '：' + p.value + ' 人' }, series: [{ type: 'funnel', sort: 'none', left: 20, right: 20, top: 10, bottom: 10, minSize: '8%', label: { formatter: p => p.name + '  ' + p.value }, data: f.map(x => ({ name: L.event[x.name] || x.name, value: x.users })) }], color: ['#EE6F97', '#F0B77E', '#7b6ad8', '#67c23a', '#409eff', '#e6a23c', '#909399', '#f56c6c', '#36cfc9', '#9254de', '#73d13d'] });
      chart(c4.value, { tooltip: { trigger: 'item' }, legend: { bottom: 0 }, series: [{ type: 'pie', radius: ['40%', '68%'], data: d.value.providers.map(x => ({ name: L.provider[x.provider] || x.provider, value: x.n })) }], color: ['#c0c4cc', '#409eff', '#EE6F97', '#1f2329'] });
    }
    onMounted(load);
    const pct = (a, b) => b ? Math.round(a * 100 / b) + '%' : '—';
    return { d, c1, c2, c3, c4, money, pct, fmtD, load };
  },
  template: `<div v-if="d">
    <div class="kpis">
      <div class="kpi"><div class="l">总用户</div><div class="v">{{d.kpi.users}}</div><div class="s">已注册 {{d.kpi.registered}} · 封禁 {{d.kpi.banned}}</div></div>
      <div class="kpi"><div class="l">今日新增</div><div class="v">{{d.kpi.new_today}}</div><div class="s">昨日 {{d.kpi.new_yesterday}}</div></div>
      <div class="kpi"><div class="l">日活 DAU</div><div class="v">{{d.kpi.dau}}</div><div class="s">昨日 {{d.kpi.dau_yesterday}}</div></div>
      <div class="kpi"><div class="l">周活 / 月活</div><div class="v">{{d.kpi.wau}} / {{d.kpi.mau}}</div></div>
      <div class="kpi"><div class="l">今日收入</div><div class="v">{{money(d.kpi.revenue_today)}}</div><div class="s">30 天 {{money(d.kpi.revenue_30d)}} · {{d.kpi.orders_30d}} 单</div></div>
      <div class="kpi"><div class="l">付费用户</div><div class="v">{{d.kpi.payers}}</div><div class="s">付费率 {{pct(d.kpi.payers, d.kpi.users)}}<span v-if="d.kpi.test_orders"> · 含测试单 {{d.kpi.test_orders}}</span></div></div>
      <div class="kpi"><div class="l">今日钻石消耗</div><div class="v">{{d.kpi.gems_spent_today}}</div><div class="s">用户钻石存量 {{d.kpi.gems_outstanding}}</div></div>
      <div class="kpi"><div class="l">社区作品</div><div class="v">{{d.kpi.works_live}}</div><div class="s">已上线</div></div>
      <div class="kpi" :class="{warn:d.kpi.works_pending}"><div class="l">待审作品</div><div class="v">{{d.kpi.works_pending}}</div></div>
      <div class="kpi" :class="{warn:d.kpi.assets_review}"><div class="l">待审素材</div><div class="v">{{d.kpi.assets_review}}</div></div>
      <div class="kpi" :class="{alert:d.kpi.reports_open}"><div class="l">未处理举报</div><div class="v">{{d.kpi.reports_open}}</div></div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>新增与日活（14 天）</h3><div ref="c1" class="chart"></div></div>
      <div class="panel"><h3>钻石消耗与收入（14 天）</h3><div ref="c2" class="chart"></div></div>
      <div class="panel"><h3>转化漏斗（近 7 天，按人数）</h3><div ref="c3" class="chart"></div></div>
      <div class="panel"><h3>登录方式分布</h3><div ref="c4" class="chart"></div></div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>新用户留存</h3>
        <el-table :data="d.retention.slice().reverse()" size="small" max-height="320"><el-table-column label="注册日" :formatter="r=>fmtD(r.day)" /><el-table-column prop="cohort" label="新增" width="70" /><el-table-column label="次日留存" :formatter="r=>r.cohort?pct(r.d1,r.cohort)+' ('+r.d1+')':'—'" /><el-table-column label="7 日留存" :formatter="r=>r.cohort?pct(r.d7,r.cohort)+' ('+r.d7+')':'—'" /></el-table></div>
      <div class="panel"><h3>热门社区作品</h3>

const Config = {
  setup() {

    async function load() { const j = await api('config'); v.value = JSON.parse(JSON.stringify(j.values)); meta.value = j.meta; }
    async function save() { await ElMessageBox.confirm('保存后立即对所有用户生效。', '确认修改配置', { type: 'warning' }); const j = await api('config', { body: { values: v.value } }); ElMessage.success('已保存 ' + Object.keys(j.changed).length + ' 项'); load(); }
    const skuRows = computed(() => v.value ? Object.entries(v.value.skus || {}).map(([k, x]) => ({ k, x })) : []);
    const llm = ref(null), probing = ref(false);
    const emb = ref(null);
    async function probeEmbed() { try { const r = await fetch('/api/longcat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ probe: true, embed: true }) }); emb.value = (await r.json()).embed; } catch (e) { ElMessage.error('测试失败：' + e.message); } }
    async function probe() { probing.value = true; try { const r = await fetch('/api/longcat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ probe: true }) }); llm.value = await r.json(); } catch (e) { ElMessage.error('测试失败：' + e.message); } finally { probing.value = false; } }
    const qw = ref(null);
    async function probeQwen() { qw.value = { busy: true }; try { const [a, b, c] = await Promise.all([fetch('/api/tts?ping=qwen&l=zh').then(r => r.json()), fetch('/api/tts?ping=qwen&l=en&v=f1').then(r => r.json()), fetch('/api/longcat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ probe: true, qwen: true }) }).then(r => r.json())]); qw.value = { zh: a, en: b, call: c.qwen || c }; } catch (e) { qw.value = null; ElMessage.error('测试失败：' + e.message); } }
    onMounted(load);
    return { v, meta, save, load, skuRows, fmt, llm, probing, probe, emb, probeEmbed, qw, probeQwen };

    String(c.md || '').replace(/\r/g, '').split('\n').forEach(raw => {
      const l = raw.trim(); if (!l || /^[=\-*_~]{3,}$/.test(l)) return;
      if (/^##\s*CHAPTER/i.test(l)) return;
      if (/^#\s*SCENE/i.test(l)) { beats.push(['sys', 'scene', { place: l.replace(/^#\s*SCENE\s*[｜|:：]?\s*/i, '') }]); inChoice = null; return; }
      if (/^#\s*CHOICE/i.test(l)) { inChoice = { q: l.replace(/^#\s*CHOICE\s*[｜|:：]?\s*/i, ''), opts: [] }; choices.push(inChoice); opt = null; return; }
      let m = l.match(/^####\s*([A-E])\s*[｜|]\s*(.*)$/); if (m && inChoice) { opt = { k: m[1], t: m[2].replace(/^[“"]|[”"]$/g, ''), then: [] }; inChoice.opts.push(opt); return; }
      if (/^####\s*入口/.test(l)) { inChoice = null; opt = null; return; }

      if (m) { sink.push([m[1].trim(), 'say', m[2]]); think = false; return; }
      if (think && /^[“"「]/.test(l)) { sink.push(['@pov', 'think', l.replace(/^[“"「]|[”"」]$/g, '')]); think = false; return; }
      think = false; sink.push(['n', 'act', l]);

      <el-input v-model="outline" type="textarea" :rows="14" placeholder="架构：体验承诺、世界边界、人物核心、四轴结局方向、每章目标与结尾选择…（可直接手写）" />
      <h3 style="margin-top:18px">逐章正文（目标 {{sel.config.chapters_target}} 章）</h3>
      <div class="toolbar"><el-button type="primary" :loading="busy==='batch'" :disabled="!!busy&&busy!=='batch'" @click="genRest">按顺序写完剩余章节</el-button><el-button v-if="busy==='batch'" @click="stop=true">停止</el-button></div>
      <div style="display:flex;flex-wrap:wrap;gap:8px"><el-button v-for="n in Number(sel.config.chapters_target)" :key="n" size="small" :type="(sel.chapters||[]).some(c=>c.n===n)?'success':'default'" :loading="busy==='ch'+n" :disabled="!!busy&&busy!=='ch'+n" @click="genOne(n)">第 {{n}} 章{{(sel.chapters||[]).some(c=>c.n===n)?' ✓ 重写':''}}</el-button></div>
      <div class="mono" style="margin-top:12px;max-height:180px;overflow:auto;font-size:12px;background:#f7f7f9;padding:8px;border-radius:6px" v-if="log.length"><div v-for="(l,i) in log" :key="i">{{l}}</div></div>
    </div>

    <!-- 3 检查 -->
    <div class="panel" v-show="step===2"><h3>③ 自动检查</h3>
      <div class="toolbar"><el-button type="primary" @click="runCheck">运行规则检查</el-button><el-button :loading="busy==='review'" :disabled="!!busy&&busy!=='review'" @click="aiReview">AI 审稿（逐条对照规则）</el-button><span class="muted" v-if="sel.qa&&sel.qa.at">上次检查：{{fmt(sel.qa.at)}} · {{sel.qa.rules}}</span></div>
      <template v-if="sel.qa">
        <el-alert v-for="(x,i) in sel.qa.err||[]" :key="'e'+i" :title="x" type="error" :closable="false" show-icon style="margin-bottom:6px" />
        <el-alert v-for="(x,i) in sel.qa.warn||[]" :key="'w'+i" :title="x" type="warning" :closable="false" show-icon style="margin-bottom:6px" />
        <el-alert v-for="(x,i) in (sel.qa.ok||[]).concat(sel.qa.info||[])" :key="'o'+i" :title="x" type="success" :closable="false" style="margin-bottom:6px" />
        <div v-if="sel.qa.estimate" class="muted" style="margin:8px 0">时长估算（estimated）：单路线约 {{sel.qa.estimate.route_minutes}} 分钟 · {{(sel.qa.estimate.assumptions||[]).join('；')}}</div>
        <h3 v-if="sel.qa.ai" style="margin-top:14px">AI 审稿意见（{{sel.qa.ai.length}} 条）</h3>
        <el-table v-if="sel.qa.ai" :data="sel.qa.ai" size="small" stripe><el-table-column prop="chapter" label="章" width="50" /><el-table-column prop="rule" label="规则" width="110" /><el-table-column prop="where" label="位置" min-width="140" /><el-table-column prop="problem" label="问题" min-width="200" /><el-table-column prop="fix" label="改法" min-width="220" /><el-table-column label="级别" width="70"><template #default="{row}"><el-tag size="small" :type="row.level==='error'?'danger':'warning'">{{row.level==='error'?'错误':'提醒'}}</el-tag></template></el-table-column></el-table>
      </template>
      <h3 style="margin-top:16px">问题 → 该调哪条规则（调试规则 第 15 节）</h3>
      <el-table :data="debugTable" size="small"><el-table-column prop="k" label="生成偏差" /><el-table-column prop="v" label="优先调整" width="260" /></el-table>
    </div>

    <!-- 4 审改 -->
    <div class="panel" v-show="step===3"><h3>④ 编剧人工审改</h3>
      <div class="toolbar"><el-select v-model="curCh" style="width:280px"><el-option v-for="c in sel.chapters" :key="c.n" :value="c.n" :label="'第 '+c.n+' 章 · '+c.t" /></el-select><el-button @click="addCh">＋ 新章节</el-button><el-button type="danger" text @click="delCh" v-if="chObj">删除本章</el-button><span class="muted" v-if="chObj">{{chObj.md.length}} 字 · 最后由 {{chObj.by}} 修改</span></div>
      <el-input v-if="chObj" v-model="chObj.md" type="textarea" :rows="22" class="mono" />
      <div class="toolbar" style="margin-top:8px"><el-button type="primary" @click="saveCh" :disabled="!chObj">保存本章（存版本）</el-button></div>
      <h3>审稿清单</h3>
      <el-checkbox-group v-model="review.checks.list"><div v-for="d in debugTable" :key="d.k"><el-checkbox :value="d.k">没有「{{d.k}}」（{{d.v}}）</el-checkbox></div></el-checkbox-group>
      <el-input v-model="review.notes" type="textarea" :rows="4" placeholder="审稿意见（会记录审稿人和时间）" style="margin-top:10px" />
      <div class="toolbar" style="margin-top:10px"><el-switch v-model="review.approved" active-text="审核通过，可以上线" /><el-button type="primary" @click="saveReview">保存审稿</el-button><span class="muted" v-if="sel.review&&sel.review.by">上次审稿：{{sel.review.by}} · {{fmt(sel.review.at)}}</span></div>
      <h3>版本记录</h3>
      <el-table :data="vers" size="small" max-height="260"><el-table-column label="时间" width="170" :formatter="r=>fmt(r.at)" /><el-table-column prop="note" label="说明" /><el-table-column prop="by_name" label="操作人" width="110" /><el-table-column width="90"><template #default="{row}"><el-button size="small" text @click="restore(row)">恢复</el-button></template></el-table-column></el-table>
    </div>

    <!-- 5 上线 -->
    <div class="panel" v-show="step===4"><h3>⑤ 上线到 App</h3>
      <el-descriptions :column="2" border size="small">
        <el-descriptions-item label="章节">{{(sel.chapters||[]).length}} 章</el-descriptions-item>
        <el-descriptions-item label="自动检查">{{sel.qa?((sel.qa.err||[]).length+' 错误 / '+(sel.qa.warn||[]).length+' 提醒'):'还没检查'}}</el-descriptions-item>
        <el-descriptions-item label="编剧审核">{{sel.review&&sel.review.approved?('✓ 通过 · '+sel.review.by):'未通过'}}</el-descriptions-item>
        <el-descriptions-item label="App 作品 ID">{{sel.work_id||'—'}}</el-descriptions-item>
        <el-descriptions-item label="上线时间">{{fmt(sel.published_at)}}</el-descriptions-item>
        <el-descriptions-item label="规则版本">{{R.version}}</el-descriptions-item>
      </el-descriptions>
      <p class="muted">上线后：App「发现」页社区区置顶显示（作者 MIRU 官方）。玩家第一次打开时，App 会按同一套规则自动生成故事页、人物资料，并配好音乐、特效和小游戏。再次上线会覆盖为新版本。</p>
      <div class="toolbar"><el-button type="primary" @click="publish(false)" :disabled="!(sel.review&&sel.review.approved)">{{sel.status==='live'?'更新线上版本':'一键上线'}}</el-button><el-button v-if="S.me.role==='owner'" type="warning" plain @click="publish(true)" :disabled="!(sel.review&&sel.review.approved)">强制上线（忽略自动检查错误）</el-button><el-button v-if="sel.status==='live'" type="danger" plain @click="unpublish">下线</el-button></div>
    </div>
  </div></div>`,
};

/* ================= app shell ================= */
const app = createApp({
  template: '#root-tpl',
  setup() {
    const route = ref((location.hash || '#dashboard').slice(1)), collapsed = ref(window.innerWidth < 900), busy = ref(false), reloadKey = ref(0);
    const lf = reactive({ username: '', password: '' }), pwDlg = ref(false), pw = reactive({ old: '', password: '' }), badge = reactive({ works: 0, assets: 0, reports: 0 });
    const payTest = ref(false); window.__payTest = payTest;
    const titles = { dashboard: '数据看板', studio: '剧本生产 · 5 步工作台', users: '用户管理', works: '作品审核', assets: '素材审核', reports: '举报处理', orders: '充值订单', ledger: '钻石流水', notices: '公告管理', events: '行为数据', i18n: '多语言词条', config: '系统配置', admins: '管理员与权限', audit: '操作日志' };
    function go(k) { route.value = k; location.hash = k; }
    window.addEventListener('hashchange', () => { route.value = (location.hash || '#dashboard').slice(1); });
    async function login() {
      busy.value = true;
      try { const j = await api('login', { body: { username: lf.username, password: lf.password } }); S.token = j.token; S.me = j.admin; S.perms = j.perms; localStorage.setItem('miru_admin_tok', j.token); localStorage.setItem('miru_admin_me', JSON.stringify(j.admin)); localStorage.setItem('miru_admin_perms', JSON.stringify(j.perms)); lf.password = ''; ElMessage.success('欢迎，' + (j.admin.name || j.admin.username)); if (!titles[route.value] || !can(permOf(route.value))) go(firstPage()); refreshBadges(); }
      catch (_) {} finally { busy.value = false; }
    }
    const permOf = r => ({ studio: 'scripts', dashboard: 'dashboard', users: 'users', works: 'works', assets: 'assets', reports: 'reports', orders: 'orders', ledger: 'ledger', notices: 'notices', events: 'events', i18n: 'i18n', config: 'config', admins: 'admins', audit: 'audit' }[r]);
    const firstPage = () => Object.keys(titles).find(k => can(permOf(k))) || 'dashboard';
    async function refreshBadges() { try { if (!can('dashboard')) return; const j = await api('dashboard'); badge.works = j.kpi.works_pending; badge.assets = j.kpi.assets_review; badge.reports = j.kpi.reports_open; payTest.value = j.payTest; } catch (_) {} }
    window.__refreshBadges = refreshBadges;
    async function changePw() { const j = await api('password', { body: pw }); S.token = j.token; localStorage.setItem('miru_admin_tok', j.token); pwDlg.value = false; pw.old = pw.password = ''; ElMessage.success('密码已修改'); }
    function cmd(c) { if (c === 'pw') pwDlg.value = true; if (c === 'out') { logout(); ElMessage.success('已退出'); } }
    onMounted(async () => { if (S.token) { try { const j = await api('me'); S.me = j.admin; S.perms = j.perms; localStorage.setItem('miru_admin_perms', JSON.stringify(j.perms)); if (!titles[route.value] || !can(permOf(route.value))) go(firstPage()); refreshBadges(); } catch (_) {} } });
    return { token: computed(() => S.token), me: computed(() => S.me), route, collapsed, busy, lf, login, go, titles, can, roleName: L.role, pwDlg, pw, changePw, cmd, badge, payTest, reloadKey };
  },
});
app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
for (const [k, c] of Object.entries(ElementPlusIconsVue)) app.component(k, c);
Object.entries({ studio: Studio, dashboard: Dashboard, users: Users, works: Works, assets: Assets, reports: Reports, orders: Orders, ledger: Ledger, notices: Notices, i18n: I18n, config: Config, admins: Admins, audit: Audit, events: Events }).forEach(([k, c]) => app.component('p-' + k, c));
app.mount('#app');
</script>
</body>
</html>
