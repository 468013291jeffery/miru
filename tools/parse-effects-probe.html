<!doctype html>
<meta charset="utf-8">
<title>parse effects probe</title>
<pre id="out">PENDING</pre>
<script>
/* 2026-10-29 · 剧本语法的「效果」探针 —— 一次跑完四层：
   ① 剧本 → doc（GOAL / SET / IF / ELSE / OPT / SECRET / REVEAL 的结构对不对）
   ② doc → pack（set/love 透传、goal/goalOwn、secrets）
   ③ pack → prompt（章节目标那行进不进、认知边界那一行进不进）
   ④ 产品自己的显示接口（__parse / __secrets）说了什么
   ⚠️ 铁律：A/B 必须在**同一个对象**上翻一个字段。别"再建一部作品来对照" ——
      imBuild 的 wid = "cw"+Date.now()，同一毫秒建两部会互相覆盖（第一版就这么读出了假失败）。 */
const SCRIPT = [
  '# CHAPTER 1｜留痕 Chapter 1',
  '⟦GOAL|这一章要让玩家决定留不留录像|This chapter: decide whether to keep the video⟧',
  '⟦SECRET|S_A|Klaus 的双尸计划|knows:Calder|reveal_from:6⟧',
  '⟦SECRET|S_B|他其实是她哥哥|knows:Greta|reveal_from:2⟧',
  '⟦CHAR|Calder|m|29|m2|冰球队长|188cm，深棕短发⟧',
  '⟦CHAR|Greta|f|31|f2|队医|说话很轻⟧',
  '# SCENE｜冰场',
  '旁白：开场。',
  '⟦SET|mem_video_kept⟧',
  '⟦IF|mem_video_kept⟧',
  'Calder：你留着录像，我记住了。',
  '⟦ELSE⟧',
  'Calder：你没留。算了。',
  '⟦/IF⟧',
  '⟦IF|!mem_video_kept⟧',
  '旁白：他不再提这件事。',
  '⟦/IF⟧',
  '⟦REVEAL|S_A⟧',
  '⟦IF|mem_video_kept⟧',
  '⟦IF|other_flag⟧',
  '旁白：嵌套里的内容（不该出现）。',
  '⟦ELSE⟧',
  '旁白：嵌套的 else。',
  '⟦/IF⟧',
  '⟦/IF⟧',
  '⟦IF|never_closed⟧',
  '旁白：没闭合的内容。',
  '# CHOICE｜你怎么做？',
  '#### A｜先救人',
  '⟦OPT|A|set:saved_him;love:2⟧',
  '旁白：你冲了过去。',
  '#### B｜先留证据',
  '旁白：你先拍了照。',
  '# ·',
  '# CHOICE｜这一章怎么收？',
  '#### A｜留下',
  '⟦OPT|A|set:stayed⟧',
  '旁白：你留下了。',
  '#### B｜离开',
  '旁白：你走了。',
  '# ·',
  /* 第二章：S_B 在 2 章揭露 ⇒ 第 2 章起它不再是秘密。 */
  '# CHAPTER 2｜揭露 Chapter 2',
  '# SCENE｜议事厅',
  '旁白：第二天。',
  'Greta：你以为那两具尸体是意外？',
  '# CHOICE｜这一章怎么收？',
  '#### A｜追问',
  '旁白：你追问了。',
  '#### B｜沉默',
  '旁白：你什么也没说。',
  '# ·',
].join('\n');

const flat = t => String(t || '').replace(/\s+/g, ' ').slice(0, 60);

(async () => {
  const out = {};
  const fr = document.createElement('iframe');
  fr.src = '/index.html'; fr.width = 400; fr.height = 300;
  document.body.appendChild(fr);
  await new Promise(r => fr.onload = r);
  const w = fr.contentWindow;
  await new Promise(r => setTimeout(r, 1800));

  /* ① 剧本 → doc */
  try {
    const doc = w.imParse(SCRIPT);
    out.warn = doc.warn || [];
    out.goal94 = doc.chapters[0].goal94 || null;
    out.secrets = (doc.secrets || []).map(s => ({ id: s.id, from: s.from, knows: s.knows }));
    out.docShape = (doc.chapters[0].items || []).map(b => {
      if (b && b.choice) return { choice: b.choice.opts.map(o => ({ t: flat(o.t), set: o.set || null, love: o.love || null })) };
      if (Array.isArray(b) && b[0] === 'sys' && b[1] === 'set') return 'set:' + (b[2].flags || []).join('+');
      if (Array.isArray(b) && b[0] === 'sys' && b[1] === 'if') return { if: b[2].cond, then: (b[2].then || []).map(x => x[1]), hasElse: !!b[2].else };
      return Array.isArray(b) ? b[1] : typeof b;
    });
  } catch (e) { out.parseErr = String(e && e.message || e) }

  /* ②③④ 在 iframe 里跑：`S` / `packPrompt` 是那里的作用域，`ch()` 是闭包函数（外面调不到）。 */
  try {
    w.__probeScript = SCRIPT;
    out.pack = w.eval(`(function(){
      var out = {};
      var d = imParse(window.__probeScript);
      var r = imBuild(d, null); var wid = r && (r.wid || r);
      var chp = S.mine.worlds[wid].pack.chapters[0];
      out.goalOwn = !!chp.goalOwn;
      var line = null; (chp.beats.zh || []).forEach(function(b){ if (!line && Array.isArray(b) && b[1] === 'line') line = b; });
      out.lineOpts = line ? line[2].opts.map(function(o){ return { set: o.set || null, love: o.love || null }; }) : null;
      out.endChoices = (chp.choices || []).map(function(c){ return { k: c.k, set: c.set || null }; });
      out.secrets = (S.mine.worlds[wid].pack.secrets || []).map(function(s){ return { id: s.id, from: s.from, knows: s.knows }; });

      var mkTh = function(k, as, flags){ var th = {wid:wid, pk:{ch:k, as:as, picks:{}, st:"play", flags: flags || {}}, cast:[], mem:[]}; return th };
      var prompt = function(th){ try { return String(packPrompt(th)) } catch(e) { return 'ERR:' + e.message } };

      /* 章节目标：正臂 + 同对象翻字段的负臂 */
      var pOn = prompt(mkTh(1, null));
      var savedOwn = chp.goalOwn; chp.goalOwn = false;
      var pOff = prompt(mkTh(1, null));
      chp.goalOwn = savedOwn;
      out.goal = { hasLine: pOn.indexOf('WHAT THIS CHAPTER IS FOR') >= 0,
                   noLineWhenGoalOwnOff: pOff.indexOf('WHAT THIS CHAPTER IS FOR') < 0 };

      /* 认知边界：**调产品自己的显示接口** __secrets（app14 里那个），不复刻判定逻辑 */
      out.hook = (typeof window.__secrets === 'function');
      if (out.hook) {
        var view = function(k, as, flags){ return window.__secrets(mkTh(k, as, flags)) };
        var cand = Object.keys(S.mine.chars || {}), rid = null, rme = null;
        for (var i = 0; i < cand.length; i++) { var v = view(1, cand[i]); if (v && v.me) { rid = cand[i]; rme = v.me; break } }
        out.sec = { actor: { id: rid, me: rme },
                    ch1_noActor: view(1, null).hidden,
                    ch1_actor: rid ? view(1, rid).hidden : 'skipped',
                    ch2_noActor: view(2, null).hidden,
                    revealFlag: view(1, null, { 'secret:S_A': 1 }).hidden };
        var sB = (S.mine.worlds[wid].pack.secrets || [])[1];
        if (sB && rme) { var saveK = sB.knows; sB.knows = [rme]; out.sec.knowsArm = view(1, rid).hidden; sB.knows = saveK }
        else out.sec.knowsArm = 'skipped';
        var sv = MIRU_TUNE.chat.secretBoundary; MIRU_TUNE.chat.secretBoundary = false;
        out.sec.flagOff = view(1, null).hidden; MIRU_TUNE.chat.secretBoundary = sv;
      }
      out.parseApi = (typeof window.__parse === 'function') ? window.__parse() : 'no-__parse';
      return out;
    })()`);
  } catch (e) { out.packErr = String(e && e.message || e) }

  document.getElementById('out').textContent = 'EFFECTS_PROBE\n' + JSON.stringify(out, null, 1);
})();
</script>
