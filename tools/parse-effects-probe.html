<!doctype html>
<meta charset="utf-8">
<title>parse effects probe</title>
<pre id="out">PENDING</pre>
<script>
/* 2026-10-29 · 剧本语法的「效果」探针：⟦SET⟧ / ⟦IF⟧⟦ELSE⟧⟦/IF⟧ / ⟦OPT⟧
   三层一起验：① 剧本 → doc 结构 ② doc → pack（imBuild 有没有把 set/love 带过去）③ 运行时函数认不认（pkCond/pkSet）。 */
const SCRIPT = [
  '# CHAPTER 1｜留痕 Chapter 1',
  '⟦GOAL|这一章要让玩家决定留不留录像|This chapter: decide whether to keep the video⟧',
  '⟦SECRET|S_A|Klaus 的双尸计划|knows:Calder|reveal_from:6⟧',
  '⟦SECRET|S_B|他其实是她哥哥|knows:Greta|reveal_from:2⟧',
  '⟦CHAR|Calder|m|29|m2|冰球队长|188cm，深棕短发⟧',
  '⟦CHAR|Greta|f|31|f2|队医|说话很轻⟧',
  '# SCENE｜冰场',
  '旁白：开场。',
  '⟦SET|mem_video_kept⟧',
  '⟦IF|mem_video_kept⟧',
  'Calder：你留着录像，我记住了。',
  '⟦ELSE⟧',
  'Calder：你没留。算了。',
  '⟦/IF⟧',
  '⟦IF|!mem_video_kept⟧',
  '旁白：他不再提这件事。',
  '⟦/IF⟧',
  /* ⟦REVEAL|S_A⟧ 提前解锁：它在正文里就该产生一个 `set:secret:S_A` 的节拍 */
  '⟦REVEAL|S_A⟧',
  '⟦IF|mem_video_kept⟧',
  '⟦IF|other_flag⟧',
  '旁白：嵌套里的内容（不该出现）。',
  '⟦ELSE⟧',
  '旁白：嵌套的 else。',
  '⟦/IF⟧',
  '⟦/IF⟧',
  '⟦IF|never_closed⟧',
  '旁白：没闭合的内容。',
  '# CHOICE｜你怎么做？',
  '#### A｜先救人',
  '⟦OPT|A|set:saved_him;love:2⟧',
  '旁白：你冲了过去。',
  '#### B｜先留证据',
  '旁白：你先拍了照。',
  '# ·',
  '# CHOICE｜这一章怎么收？',
  '#### A｜留下',
  '⟦OPT|A|set:stayed⟧',
  '旁白：你留下了。',
  '#### B｜离开',
  '旁白：你走了。',
  '# ·',
  /* 第二章：给"认知边界"用 —— S_B 在 2 章揭露，所以第 2 章起它不再是秘密。 */
  '# CHAPTER 2｜揭露 Chapter 2',
  '# SCENE｜议事厅',
  '旁白：第二天。',
  'Greta：你以为那两具尸体是意外？',
  '# CHOICE｜这一章怎么收？',
  '#### A｜追问',
  '旁白：你追问了。',
  '#### B｜沉默',
  '旁白：你什么也没说。',
  '# ·',
].join('\n');

const flat = t => String(t || '').replace(/\s+/g, ' ').slice(0, 60);

(async () => {
  const out = {};
  const fr = document.createElement('iframe'); fr.src = '/index.html'; fr.width = 400; fr.height = 300;
  document.body.appendChild(fr);
  await new Promise(r => fr.onload = r);
  const w = fr.contentWindow;
  await new Promise(r => setTimeout(r, 1500));
  let doc = null;
  try {
    doc = w.imParse(SCRIPT);
    out.warn = doc.warn || [];
    out.goal94 = doc.chapters[0].goal94 || null;
    out.docShape = (doc.chapters[0].items || []).map(b => {
      if (b && b.choice) return { choice: b.choice.opts.map(o => ({ t: flat(o.t), set: o.set || null, love: o.love || null, then: (o.then || []).map(x => x[1] === 'set' ? 'set:' + (x[2].flags || []).join('+') : x[1]) })) };
      if (Array.isArray(b) && b[0] === 'sys' && b[1] === 'set') return 'set:' + (b[2].flags || []).join('+');
      if (Array.isArray(b) && b[0] === 'sys' && b[1] === 'if') return { if: b[2].cond, then: (b[2].then || []).map(x => x[1]), hasElse: !!b[2].else };
      return Array.isArray(b) ? b[1] : typeof b;
    });
  } catch (e) { out.parseErr = String(e && e.message || e) }

  /* ② doc → pack：imBuild 有没有把 set/love 带到 line 选项与章末 choices 上。
     注意：`S` 是 script 顶层的 const（不是 window.S）⇒ 只能在 iframe 自己那一侧 eval 才看得见。 */
  try {
    w.__probeScript = SCRIPT;
    out.pack = w.eval(`(function(){
      var d = imParse(window.__probeScript);
      var r = imBuild(d, null); var wid = r && (r.wid || r);
      var ch = S.mine.worlds[wid].pack.chapters[0];
      var line = null; (ch.beats.zh || []).forEach(function(b){ if (!line && Array.isArray(b) && b[1] === 'line') line = b; });
      var flat = function(t){ return String(t||'').replace(/\\s+/g,' ').slice(0,60); };
      var th = {wid:wid, pk:{ch:1, as:null, picks:{}, st:"play", flags:{}}, cast:[], mem:[]};
      var pOn = ''; try { pOn = String(packPrompt(th)) } catch(e) { pOn = 'ERR:' + e.message }
      /* 负对照**不另建一部作品**（第一版就是因为 imBuild 的 wid = "cw"+Date.now() 在同一毫秒里撞了、
         把正臂那部覆盖掉，才读出假失败）。改成同一个世界、只翻一个字段：goalOwn 关掉后那行必须消失。 */
      var saved = ch.goalOwn; ch.goalOwn = false;
      var pOff = ''; try { pOff = String(packPrompt(th)) } catch(e) { pOff = 'ERR:' + e.message }
      ch.goalOwn = saved;
      /* ③ 认知边界：同一部作品、三个读数
         A 第1章 · 演 Calder（S_A 他知道 / S_B 他不知道，且 2 章才揭露）⇒ 只剩 S_B
         B 第2章 · 演 Calder（S_B 已揭露）⇒ 一个都不该剩
         C 开关关掉 ⇒ 一个都不该剩 */
      var castIds = S.mine.worlds[wid].cast || [];
      var calder = null; castIds.forEach(function(id){ if (ch2n(id) === 'Calder') calder = id });
      function ch2n(id){ try { return ch(id) && ch(id).n } catch(e) { return null } }      var mkTh = function(k, as){ return {wid:wid, pk:{ch:k, as:as, picks:{}, st:"play", flags:{}}, cast:[], mem:[]} };
      var sec = { secrets: (S.mine.worlds[wid].pack.secrets || []).map(function(s){ return { id: s.id, from: s.from, knows: s.knows } }), calderId: !!calder, names: castIds.map(function(id){ return ch2n(id) }) };
      try {
        var pa = packPrompt(mkTh(1, calder));
        var pb = packPrompt(mkTh(2, calder));
        var savedF = MIRU_TUNE.chat.secretBoundary; MIRU_TUNE.chat.secretBoundary = false;
        var pc = packPrompt(mkTh(1, calder)); MIRU_TUNE.chat.secretBoundary = savedF;
        sec.ch1_A_hidden = pa.indexOf('Klaus') >= 0; sec.ch1_B_hidden = pa.indexOf('哥哥') >= 0;
        sec.ch2_B_hidden = pb.indexOf('哥哥') >= 0; sec.ch2_A_hidden = pb.indexOf('Klaus') >= 0;
        sec.flagOff_B_hidden = pc.indexOf('哥哥') >= 0;
        /* knows 那一支：拿一个**真**的角色 id 演，再把 S_B 的 knows 改成他的名字 ⇒ 他不该再被蒙在鼓里。
           （cast 里没有名字时退一步：用 pack.join 的主角 id。） */
        var someId = null;
        Object.keys(S.mine.chars || {}).forEach(function(k){ if (!someId) { try { if (ch(k)) someId = k } catch(e) {} } });
        var nm2 = someId ? ch2n(someId) : null;
        var sB = (S.mine.worlds[wid].pack.secrets || [])[1];
        if (sB && someId) {
          var before = packPrompt(mkTh(1, someId)).indexOf('哥哥') >= 0;
          var saveK = sB.knows; sB.knows = nm2 ? [nm2] : [];
          var after = packPrompt(mkTh(1, someId)).indexOf('哥哥') >= 0;
          sB.knows = saveK;
          sec.knowsArm = { id: someId, name: nm2, hiddenBefore: before, hiddenAfterAddKnows: after };
        } else sec.knowsArm = { skipped: true, castLen: castIds.length };
        /* ⟦REVEAL⟧ 那一支：第 1 章（S_A 声称 6 章才揭）打上 secret:S_A 的旗 ⇒ 立刻不再"你不知道"；
           S_B 不受影响（它没有 REVEAL）。 */
        var thF = mkTh(1, null); thF.pk.flags = { 'secret:S_A': 1 };
        var pf = packPrompt(thF);
        sec.revealArm = { A_hiddenBeforeFlag: pa.indexOf('Klaus') >= 0, A_hiddenAfterFlag: pf.indexOf('Klaus') >= 0, B_stillHidden: pf.indexOf('哥哥') >= 0 };
      } catch (e) { sec.err = String(e && e.message || e) }
      return {
        goal: ch.goal || null,
        goalOwn: !!ch.goalOwn,
        promptHasGoal: pOn.indexOf('decide whether to keep the video') >= 0 ? 'yes' : ('no: ' + pOn.slice(0, 80)),
        offArm: { hadLine: pOn.indexOf('WHAT THIS CHAPTER IS FOR') >= 0, stillHasLine: pOff.indexOf('WHAT THIS CHAPTER IS FOR') >= 0, goalStillThere: pOff.length > 0 },
        sec: sec,
        dbg: { sameObject: true, goalOwn: ch.goalOwn, hasGoalEn: !!(ch.goal && ch.goal.en), chapterGoalFlag: (typeof MIRU_TUNE !== 'undefined' && MIRU_TUNE.chat) ? MIRU_TUNE.chat.chapterGoal : 'no-tune' },
        lineOpts: line ? line[2].opts.map(function(o){ return { t: flat(o.t), set: o.set || null, love: o.love || null }; }) : null,
        endChoices: (ch.choices || []).map(function(c){ return { k: c.k, set: c.set || null, mem: !!c.mem }; })
      };
    })()`);
  } catch (e) { out.packErr = String(e && e.message || e) }

  /* ③ 运行时函数：旗/条件真的会动 */
  try {
    const th = { pk: { flags: {} }, cast: [], love: {}, mem: [] };
    out.cond_before = w.pkCond(th, { flag: 'mem_video_kept' });
    w.pkSet(th, ['mem_video_kept']);
    out.flags_after_set = Object.keys(th.pk.flags);
    out.cond_after = w.pkCond(th, { flag: 'mem_video_kept' });
    out.cond_not_after = w.pkCond(th, { not: 'mem_video_kept' });
  } catch (e) { out.condErr = String(e && e.message || e) }

  document.getElementById('out').textContent = 'EFFECTS_PROBE\n' + JSON.stringify(out, null, 1);
})();
</script>
