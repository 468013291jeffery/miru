<!doctype html>
<meta charset="utf-8">
<title>render snapshot</title>
<pre id="out">running…</pre>
<pre id="probe">probe…</pre>
<iframe id="f" src="/index.html" style="width:420px;height:700px;border:0"></iframe>
<script>
/* 消息渲染快照：对每种消息类型各渲染一次，把 HTML 原样吐出来。
   用途 = 迁移 msgHTML 之前/之后的**逐字节对拍**（见 docs/msg-render-registry.md §4）。 */
setTimeout(function () {
  var out = document.getElementById('out');
  var w = document.getElementById('f').contentWindow;
  if (!w || typeof w.msgHTML !== 'function') { out.textContent = 'ERR no msgHTML'; return }

  /* STUB：把角色/世界查询固定成桩 —— 快照测的是 msgHTML 的**分支与结构**，
     不是内容。真实的 C/W/S 是 bundle 里的 const，从外面取不到；
     打桩能让每一种消息都渲染出来，且**每一次跑都一样**（这正是对拍需要的）。 */
  try {
    w.ch = function (id) { return { id: id, n: '测试角色', pal: ['#EE6F97', '#F6B4C9'], face: null } };
    w.first = function (s) { return String(s || '').split(/[·s]/)[0] };
    w.wd = function (wid) { return { id: wid || 'w_snap', cast: ['c'], pack: { intro: { bg: [], you: '', cast: [] }, chapters: [], endings: {} }, cover: 0, title: { zh: '样例世界' }, premise: '' } };
    w.me = function () { return '你' };
  } catch (e) {}

  var KINDS = [
    /* 2026-10-27 补 pk:1 —— 没有它 speakerOf 判不出 self，这条样例其实一直在测「别人说」，您扮演的角色 那条分支从未被这条快照覆盖过。 */
  ['say',    { who: 'c', k: 'say', pk: 1, txt: '样例台词一句话。' }],
    ['act',    { who: 'c', k: 'act',   txt: '他把杯子挪到一边。' }],
    ['think',  { who: 'c', k: 'think', txt: '他没说出口的那半句。' }],
    ['narr',   { who: 'n', k: 'say',   txt: '街灯把水洼照亮。' }],
    ['box',    { who: 'c', k: 'box',   parts: [{ who: 'c', k: 'say', txt: '块里的台词。' }] }],
    ['scene',  { who: 'sys', k: 'scene', place: '后巷', time: '夜里' }],
    ['event',  { who: 'sys', k: 'event', icon: '⚡', title: '事件标题', txt: '事件说明' }],
    ['intro',  { who: 'sys', k: 'intro' }],
    ['card',   { who: 'sys', k: 'card', title: '卡片标题', txt: '卡片正文' }],
    ['warn',   { who: 'sys', k: 'warn', txt: '提示一句' }],
    ['react',  { who: 'c', k: 'react', txt: '反应一句' }],
    ['dir',    { who: 'sys', k: 'dir', txt: '导演指令' }],
    ['vn96',   { who: 'c', k: 'vn96', txt: '视觉小说行' }],
    ['xtitle', { who: 'sys', k: 'xtitle', title: '章节标题', txt: '副标题' }],
    ['xmoney', { who: 'sys', k: 'xmoney', n: 100, txt: '钱' }],
    ['xpost',  { who: 'sys', k: 'xpost', title: '帖子', txt: '正文' }],
    ['xanchor',{ who: 'sys', k: 'xanchor', title: '锚点', txt: '正文' }],
    ['npc-say',{ who: 'npc', k: 'say',  txt: '别的角色说的一句（角色卡不在 pk.as）+。' }],
    ['me-say', { who: 'me', k: 'say',   txt: '玩家自己说的一句。' }],
    ['me-act', { who: 'me', k: 'act',   txt: '玩家做了一个动作。' }]
  ];

  var result = {};
  for (var n = 0; n < KINDS.length; n++) {
    var name = KINDS[n][0], m = KINDS[n][1];
    var th = {
      id: 'snap', wid: 'w_snap', cast: ['c'], msgs: [m],
      pk: { as: 'c', ch: 1, q: [], stop: null, picks: {} },
      love: { c: 10 }, addr: null, said: []
    };
    var html = '';
    try { html = String(w.msgHTML(m, 0, th) || '') } catch (e) { html = 'ERR ' + (e && e.message) }
    result[name] = html;
  }
  out.textContent = 'SNAPSHOT_JSON:' + JSON.stringify(result);
  out.setAttribute('data-done', '1');

  /* ================= 第二块：msgHTML 各层「有没有真的干活」=================
     为什么需要它：19 种消息的逐字节对拍只能证明「结构没变」，证不了「某一层还活着」。
     `app16` 的 fmtMix 和 `app18` 的贴纸分支找的是 `<div class="bub">`，而气泡早就换成
     `.m-box` 了 —— 对拍永远绿，功能一直是死的。这一块直接问每一层：**你改过东西吗**。 */
  (function () {
    var probe = document.getElementById('probe');
    if (!probe) return;
    var MK = w.MSGKIND;
    if (!MK || !MK.items) { probe.textContent = 'MSGKIND_JSON:{"error":"no MSGKIND"}'; return }

    function hitMap() { var o = {}; MK.items.forEach(function (x) { o[x.name] = x.hit }); return o }
    function delta(a, b) { var r = []; MK.items.forEach(function (x) { if ((b[x.name] || 0) > (a[x.name] || 0)) r.push(x.name) }); return r }

    /* [探针名, 看哪个层, 消息, 线程补丁, 世界补丁] —— 每条探针只为一层准备，好让「谁动了」可归因。
       世界补丁 = 临时改写 wd() 的返回值（app94 的换人称要 w.you94 才动得起来），
       用完立刻还原，**绝不改全局桩** —— 一改，19 种对拍的基线就作废了。 */
    var PROBES = [
      ['对照：普通一句台词', null, { who: 'c', k: 'say', txt: '普通一句话。' }, {}],
      /* ⚠️ 说话人必须是**别人**（c2），不能用 c —— c 正好等于 th.pk.as，会走 app3_chat 的
         「你扮演这个人」分支（L181），那条分支根本不发 `.mquick`，于是「去按钮」永远命中 0。
         第一版就是这么红的：红在样例选错，不在层死了。 */
      ['去快捷按钮 · 普通台词', 'app16_story2.js#mquick', { who: 'c2', k: 'say', txt: '普通一句话。' }, {}],
      ['行内 *动作* 高亮', 'app16_story2.js', { who: 'c', k: 'say', txt: '*把他拉近* 别走。' }, {}],
      ['（舞台指令）改入参', 'app34_hints.js', { who: 'c', k: 'say', pk: 1, txt: '（他把杯子挪开）我在。' }, {}],
      ['付款行 · 没说出口的话', 'app35_pay.js', { who: 'me', k: 'say', txt: '我选这个。', rthink: '其实我想说……' }, { _snapId: 1 }],
      ['电话卡 · 接听按钮', 'app98_story.js', { who: 'c', k: 'say', txt: '（电话响了）', call98: 'c' }, {}],
      ['编辑过 · 小标签', 'app73_features.js', { who: 'c', k: 'say', txt: '改过的一句。', edited: 1 }, {}],
      ['贴纸 / 纯表情放大', 'app18_promo.js', { who: 'c', k: 'say', txt: '🌙' }, {}],
 ['行内 *动作* · 别人', 'app16_story2.js', { who: 'c2', k: 'say', txt: '*把他拉近* 别走。' }, {}],
 ['编辑过 · 别人', 'app73_features.js', { who: 'c2', k: 'say', txt: '改过的一句。', edited: 1 }, {}],
 ['贴纸 · 别人', 'app18_promo.js', { who: 'c2', k: 'say', txt: '🌙' }, {}],
 ['电话卡 · 别人', 'app98_story.js', { who: 'c2', k: 'say', txt: '（电话响了）', call98: 'c2' }, {}],
      ['未接来电', 'app20_fx_booth.js', { who: 'c', k: 'missed', txt: '未接来电' }, {}],
      ['撤回', 'app37_hooks.js', { who: 'c', k: 'xrecall', rw: 'c', txt: '撤回' }, {}],
      ['拒绝', 'app42_decline.js', { who: 'c', k: 'declined', cid: 'c', txt: '拒绝' }, {}],
      ['视觉小说行', 'app96_social.js', { who: 'c', k: 'vn96', txt: '视觉小说行' }, {}],
      /* —— 第 3 步：条件型认领层（box / scene / intro / event / act / think / say / mono / x* / item101）—— */
      ['块里有台词（box）', 'app16_story2.js#kinds', { who: 'c', k: 'box', parts: [{ who: 'c', k: 'say', txt: '块里的台词。' }] }, {}],
      ['场景卡（scene）', 'app16_story2.js#kinds', { who: 'sys', k: 'scene', place: '后巷', time: '夜里' }, {}],
      ['开场介绍（intro）', 'app16_story2.js#kinds', { who: 'sys', k: 'intro' }, {}],
      ['剧情事件卡（event）', 'app16_story2.js#pk', { who: 'sys', k: 'event', icon: '⚡', title: '停电', txt: '整层楼黑下来。' }, {}],
      ['玩家的动作行', 'app16_story2.js#pk', { who: 'me', k: 'act', txt: '我抬手挡住灯。' }, {}],
      ['玩家的心声行', 'app16_story2.js#pk', { who: 'me', k: 'think', txt: '我刚才不该那么说。' }, {}],
      ['别人说话 · 剧本模式成气泡', 'app17_custom.js', { who: 'c2', k: 'say', pk: 1, txt: '他把杯子挪开。' }, {}],
      ['我自己的剧本台词 · 右手气泡', 'app26_turns.js', { who: 'c', k: 'say', pk: 1, txt: '剧本里我自己的台词。' }, {}],
      ['内心独白卡（mono）', 'app19_bgm.js', { who: 'sys', k: 'mono', t: [['c', '他心里其实没底。']] }, {}],
      ['章节标题（xtitle）', 'app23_heir.js', { who: 'sys', k: 'xtitle', t: '第三章' }, {}],
      ['遗产金额 · 已解锁（交给内层）', 'app23_heir.js', { who: 'sys', k: 'xmoney', from: '$1.1B', to: '$4.2B', label: '今天', open: 1 }, {}],
      ['遗产金额 · 未解锁封口', 'app24_gl.js', { who: 'sys', k: 'xmoney', from: '$1.1B', to: '$4.2B', label: '今天' }, {}],
      ['旁白换人称（扮演别人）', 'app94_official2.js', { who: 'n', k: 'say', txt: '你推开门。' }, {}, { you94: 'c2' }],
      ['捡到东西（item101）', 'app101_you.js', { who: 'sys', k: 'item101', n: '旧钥匙', d: '铜的，很旧', ic: '🗝' }, {}]
    ];

    var outP = [];
    for (var p = 0; p < PROBES.length; p++) {
      var name = PROBES[p][0], layer = PROBES[p][1], m = PROBES[p][2], patch = PROBES[p][3] || {};
      var wpatch = PROBES[p][4] || null;
      var th = {
        id: 'probe', wid: 'w_snap', cast: ['c'], msgs: [m],
        pk: { as: 'c', ch: 1, q: [], stop: null, picks: {} },
        love: { c: 10 }, addr: null, said: []
      };
      Object.keys(patch).forEach(function (k) { th[k] = patch[k] });
      var wd0 = w.wd;
      if (wpatch) w.wd = function () {
        var x = wd0.apply(this, arguments);
        if (x) Object.keys(wpatch).forEach(function (k) { x[k] = wpatch[k] });
        return x;
      };
      var before = hitMap(), html = '';
      try { html = String(w.msgHTML(m, 0, th) || '') }
      catch (e) { html = 'ERR ' + (e && e.message) }
      finally { if (wpatch) w.wd = wd0 }
      /* 1200 而不是 500：app3_chat 把 `.mquick` 一排按钮放在**行末**，
         截太短会让「不该出现 mquick」这条因为截断而假绿。 */
      outP.push({ name: name, layer: layer, fired: delta(before, hitMap()),
  /* 2026-10-27：**截断前先剥 base64**。NPC 消息的头像内联成 data:image/jpeg 有几千字符，
     1200 的窗口被它整个占满 ⇒ 探针看不见气泡和正文 ⇒ 四个后处理层被误判成「失效」。
     实测：c2 样例的 html 长度 1200、结尾停在 base64 中间、里面既没有 <p class="bac"> 也没有 .bub。 */
  html: html.replace(/src="data:[^"]*"/g, 'src="data:…"').slice(0, 1200) });
    }

    probe.textContent = 'MSGKIND_JSON:' + JSON.stringify({
      probes: outP,
      layers: MK.items.map(function (x) {
        return { name: x.name, cls: x.cls, kinds: x.kinds, hit: x.hit, nextCalled: x.nextCalled, err: x.err }
      })
    });
    probe.setAttribute('data-done', '1');
  })();
}, 9000);
</script>
