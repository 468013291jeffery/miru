<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#07060A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MIRU</title>
<!-- 字体不再阻塞首屏（2026-10-25 实测）：
     原来这里是一个同步 <link rel="stylesheet">，指向 fonts.googleapis.com。
     在国内这台机器上它会让 domInteractive 从 **133 ms 涨到 1,708 ms** —— 一次外链卡住整个启动。
     Google Fonts 到不了时，浏览器要等到超时才继续，而这段时间玩家看到的就是"打开卡住"。
     桌面上是 1.6 秒，手机上更久。
     改法：先按"不阻塞"加载（media=print → onload 切回 all），拿不到就用 CSS 里已有的字体栈
     （--serif: Fraunces, Georgia, serif / --sans: Manrope, Helvetica, sans-serif）—— 外观退一步，启动不退。 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Manrope:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" referrerpolicy="no-referrer">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Manrope:wght@400;500;600;700;800&display=swap"></noscript>
<style>
:root{color-scheme:dark;
 --bg:#0C0B10;--stage:#07060A;--panel:#16141C;--panel2:#1D1A25;--raise:#252130;--line:#2C2835;--line2:#221F29;
 --text:#F4EFF5;--dim:#AAA1B0;--faint:#77707E;--rose:#EE6F97;--gold:#F0B77E;--violet:#9C84E0;--mint:#7FC4A6;--danger:#E36A6A;
 --grad:linear-gradient(135deg,#F0B77E,#EE6F97);--r:18px;--rs:12px;
 /* 消息排版口令（2026-10-27）：一条消息长什么样，只在这里定一次。
    原先 .m-box / .bub / .m-turn .tb / .m-narr / .m-chap 各写各的 —— 
    实测同一列里出现过 5 套字号、5 套圆角、5 套内边距。 */
 --msg-fs:14px;--msg-name:11.5px;--msg-r:18px;--msg-tail:6px;--msg-pad:10px 14px;--msg-gap:10px 12px;
 --serif:"Fraunces",Georgia,"Songti SC","Noto Serif KR",serif;
 --sans:"Manrope","Helvetica Neue",-apple-system,"PingFang SC","Hiragino Sans","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
*{box-sizing:border-box}
html,body{height:100%}@supports(height:100dvh){html,body{height:100dvh}}
body{margin:0;background:var(--stage);color:var(--text);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:600;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.app{height:100%;display:grid;place-items:center;background:radial-gradient(60% 40% at 15% 0%,rgba(238,111,151,.12),transparent 70%),radial-gradient(50% 40% at 90% 100%,rgba(156,132,224,.1),transparent 70%),var(--stage)}
.device{position:relative;width:100%;max-width:460px;height:100%;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:900px){.device{height:min(100%,920px);border-radius:36px;border:1px solid var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);animation:in .25s ease}
.screen[hidden]{display:none!important}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding-inline:16px}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column}
.stack>*{flex-shrink:0}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:800}
.dim{color:var(--dim)}.faint{color:var(--faint)}
.sm{font-size:12px}.xs{font-size:10.5px}
.num{font-variant-numeric:tabular-nums}
/* bars */
.topbar{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;background:linear-gradient(180deg,var(--bg) 70%,transparent);position:relative;z-index:3}
.brand{font-family:var(--serif);font-size:22px;letter-spacing:.2em;font-weight:600}
.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600}
.ibtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center;color:var(--dim);flex:none;font-size:15px}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.tabbar button{display:grid;gap:3px;justify-items:center;color:var(--faint);font-size:10px;font-weight:700;padding:3px 0}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.tabbar button.on{color:var(--text)}.tabbar button.on svg{stroke:var(--rose)}
/* buttons & chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:999px;font-weight:800;font-size:14px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--grad);color:#1B1017}
.btn-g{border:1px solid var(--line);background:var(--panel2)}
.btn-q{color:var(--dim);font-weight:600;font-size:13px;padding:10px}
.btn-sm{padding:9px 14px;font-size:12.5px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--dim);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;flex:none}
.chip.on{background:rgba(238,111,151,.14);border-color:rgba(238,111,151,.55);color:var(--text)}
.tag{font-size:10.5px;font-weight:700;color:var(--dim);background:var(--panel2);border-radius:6px;padding:3px 7px;white-space:nowrap}
.hs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.hs::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:6px 11px;border-radius:999px;font-size:11.5px;font-weight:800;color:var(--faint)}
.seg button.on{background:var(--raise);color:var(--text)}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:14px 15px}
.sec{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:22px 16px 10px}
.sec h2{font-size:21px}
.sec .more{font-size:12px;color:var(--gold);font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:800}
.field input,.field textarea,.field select{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px;outline:none;resize:none;width:100%}
.field input:focus,.field textarea:focus{border-color:rgba(240,183,126,.6)}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);z-index:99;background:rgba(32,28,40,.97);border:1px solid rgba(240,183,126,.4);padding:10px 16px;border-radius:14px;font-size:12.5px;font-weight:700;max-width:88%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5);animation:in .25s ease}
/* sheet */
.sheet{position:absolute;inset:0;z-index:85;background:rgba(5,4,8,.6);display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet-card{width:100%;max-height:88%;overflow-y:auto;background:var(--panel);border-radius:26px 26px 0 0;border-top:1px solid var(--line);padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.2,1);scrollbar-width:none}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:20px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 4px;border-bottom:1px solid var(--line2)}
.opt:last-child{border-bottom:0}
.opt .ic{width:34px;height:34px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-size:16px;flex:none}
.opt b{display:block;font-size:14px}.opt span{display:block;font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.45}
.opt.locked{opacity:.45}
.pill{font-size:10px;font-weight:800;padding:3px 7px;border-radius:999px;background:rgba(156,132,224,.2);color:#C9B8FF;white-space:nowrap}
/* art */
.art{position:relative;overflow:hidden;background:var(--panel2)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.av{border-radius:50%;overflow:hidden;flex:none;background:var(--panel2)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(8,7,11,.92))}
/* onboarding */
.ob-art{height:42%;min-height:230px;position:relative;overflow:hidden;flex:none}
.ob-art .cols{position:absolute;inset:-10%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;transform:rotate(-5deg)}
.ob-art .col{display:flex;flex-direction:column;gap:8px;animation:drift 40s linear infinite}
.ob-art .col:nth-child(2){animation-direction:reverse;animation-duration:50s}
.ob-art .col img{border-radius:14px;width:100%;aspect-ratio:3/4;object-fit:cover}
@keyframes drift{to{transform:translateY(-40%)}}
.ob-art .fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,11,16,.2),var(--bg) 95%)}
.bigopt{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--panel);width:100%}
.bigopt.on{border-color:rgba(238,111,151,.6);background:linear-gradient(135deg,rgba(240,183,126,.1),rgba(238,111,151,.12)),var(--panel)}
.bigopt b{display:block;font-size:15px}.bigopt span{display:block;font-size:11.5px;color:var(--dim);margin-top:2px}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none;font-size:12px;font-weight:900}
.on>.check,.check.on{background:var(--grad);border-color:transparent;color:#1B1017}
.progress{height:3px;background:var(--line2);border-radius:2px;overflow:hidden;flex:1}
.progress i{display:block;height:100%;background:var(--grad);transition:width .3s}
/* home */
.stories::-webkit-scrollbar{display:none}
.story.new .ring{background:conic-gradient(from 200deg,#F0B77E,#EE6F97,#9C84E0,#F0B77E)}
.story .av{width:60px;height:60px;border:2.5px solid var(--bg)}
.story.new b{color:var(--text)}
.cont{display:flex;gap:12px;align-items:center;padding:10px;border-radius:18px;background:linear-gradient(120deg,rgba(238,111,151,.13),transparent 65%),var(--panel);border:1px solid var(--line2);width:100%;text-align:left}
.cont .art{width:54px;height:66px;border-radius:12px;flex:none}
.cont b{font-size:14px;display:block}.cont p{font-size:12px;color:var(--dim);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shortcard{position:relative;border-radius:22px;overflow:hidden;height:210px;width:100%;text-align:left;display:block}
.shortcard .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:rgba(10,8,14,.55);backdrop-filter:blur(8px);display:grid;place-items:center;border:1px solid rgba(255,255,255,.25)}
.shortcard .cap{position:absolute;left:16px;right:16px;bottom:14px}
.post{border-top:1px solid var(--line2);padding:14px 0}
.post .hd{display:flex;gap:10px;align-items:center;padding:0 16px 10px}
.post .hd .av{width:34px;height:34px}
.post .ph{aspect-ratio:4/5;margin:0 16px;border-radius:18px}
.post .acts{display:flex;gap:16px;align-items:center;padding:10px 16px 4px}
.post .acts button{display:flex;gap:6px;align-items:center;font-size:12.5px;font-weight:700;color:var(--dim)}
.post .acts svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.post .acts .liked{color:var(--rose)}.post .acts .liked svg{fill:var(--rose);stroke:var(--rose)}
.post .cap{padding:2px 16px 0;font-size:13px;line-height:1.5}
.post .reply{display:flex;gap:8px;margin:10px 16px 0}
.post .reply input{flex:1;background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:9px 13px;font-size:12.5px;outline:none}
/* home rows */
.contc{position:relative;width:150px;height:190px;border-radius:18px;overflow:hidden;text-align:left;display:block;border:1px solid var(--line2)}
.contc .art{position:absolute;inset:0}.contc .cap{position:absolute;left:10px;right:10px;bottom:10px;z-index:2}
.contc b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.contc p{font-size:11px;color:var(--dim);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.herodrama{position:relative;display:block;width:100%;height:440px;border-radius:24px;overflow:hidden;text-align:left;border:1px solid var(--line2)}
.herodrama .veil{background:linear-gradient(180deg,rgba(8,7,11,.1) 30%,rgba(8,7,11,.95))}
.herodrama .cap{position:absolute;left:18px;right:18px;bottom:18px;z-index:2}
.dcard{position:relative;width:128px;height:200px;border-radius:16px;overflow:hidden;display:block;text-align:left;border:1px solid var(--line2)}
.dcard .art{position:absolute;inset:0}.dcard .cap{position:absolute;left:9px;right:9px;bottom:9px;z-index:2;font-size:12.5px;line-height:1.25}
.rxw{position:relative;width:110px;height:140px;border-radius:14px;overflow:hidden;flex:none;border:2px solid transparent;text-align:left}
.rxw.on{border-color:var(--rose)}.rxw .art{position:absolute;inset:0}.rxw b{position:absolute;left:8px;right:8px;bottom:8px;z-index:2;font-size:11.5px;line-height:1.2}
.rxprev{border-radius:20px;overflow:hidden;border:1px solid var(--line2)}
.rxcov{position:relative;height:300px;background:var(--panel2)}.rxcov img{position:absolute;top:0;height:100%;object-fit:cover}
.rxcov .cap{position:absolute;left:14px;right:14px;bottom:14px;z-index:2}.rxcov h3{font-size:20px}.rxcov .hk{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.45}
/* story cards */
.rail{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start;flex:none}
.wcard{width:200px;text-align:left;border-radius:20px;overflow:hidden;background:var(--panel);border:1px solid var(--line2);display:block}
.wcard .art{height:250px}
.wcard .cap{position:absolute;left:12px;right:12px;bottom:11px;z-index:2}
.wcard h3{font-size:18px;line-height:1.15}
.wcard .hk{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{position:absolute;top:10px;left:10px;z-index:2;font-size:9px;letter-spacing:.12em;font-weight:800;text-transform:uppercase;background:rgba(10,8,14,.7);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);padding:4px 7px;border-radius:7px}
.badge.q{color:#FFD08A}.badge.g{color:#B9A6FF}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.gcard{text-align:left;display:block;border-radius:18px;overflow:hidden;background:var(--panel);border:1px solid var(--line2)}
.gcard .art{aspect-ratio:3/4}
.gcard .b{padding:9px 10px 11px}
.gcard b{font-size:13.5px;display:block;line-height:1.25}
.gcard .s{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcard .m{display:flex;gap:6px;align-items:center;margin-top:7px;font-size:10.5px;color:var(--faint);font-weight:700}
/* discover */
.tagrows{border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);margin-top:12px}
.tagrow{display:grid;grid-template-columns:74px 1fr;align-items:center;border-bottom:1px solid var(--line2)}
.tagrow:last-child{border-bottom:0}
.tagrow>b{font-size:11px;font-weight:800;color:var(--dim);padding:0 0 0 16px}
.tagrow .hs{padding:8px 16px 8px 0}
.search{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 16px}
.search input{flex:1;background:none;border:0;outline:none;font-size:13.5px;min-width:0}
/* story page */
.hero{position:relative;height:340px;flex:none}
.hero .art{position:absolute;inset:0}
.hero .veil{background:linear-gradient(180deg,rgba(8,7,11,.2) 0%,transparent 30%,rgba(12,11,16,.96) 96%)}
.hero .cap{position:absolute;left:16px;right:16px;bottom:12px;z-index:2}
.hero h1{font-size:30px;line-height:1.1}
.backbtn{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:14px;z-index:5;background:rgba(10,8,14,.55);backdrop-filter:blur(8px)}
.stats{display:flex;gap:14px;font-size:12px;color:var(--dim);font-weight:700}
.stats span{display:flex;gap:5px;align-items:center}
.tabs{display:flex;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--bg);z-index:4}
.tabs button{flex:1;padding:12px 0;font-size:13px;font-weight:800;color:var(--faint);border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-color:var(--rose)}
.warn{border:1px solid rgba(227,106,106,.4);background:linear-gradient(120deg,rgba(227,106,106,.12),transparent),var(--panel);border-left:3px solid var(--danger)}
.warn .eyebrow{color:#F09A9A}
.reltable{border:1px solid var(--line2);border-radius:14px;overflow:hidden}
.reltable div{display:grid;grid-template-columns:110px 1fr;border-bottom:1px solid var(--line2)}
.reltable div:last-child{border-bottom:0}
.reltable b{background:var(--panel2);padding:10px 12px;font-size:12px}
.reltable span{padding:10px 12px;font-size:12px;color:var(--dim);line-height:1.45}
.selrow{display:flex;gap:8px}
.sel{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 12px;font-size:12.5px;font-weight:700;text-align:left}
.sel small{display:block;font-size:9.5px;color:var(--faint);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.sel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview{font-size:12px;color:var(--dim);line-height:1.55;font-style:italic;font-family:var(--serif);max-height:3.2em;overflow:hidden}
.comment{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line2)}
.comment .av{width:30px;height:30px;background:var(--raise);display:grid;place-items:center;font-size:12px;font-weight:800}
.profile div{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:13px;line-height:1.5}
.profile b{color:var(--faint);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.pitch{font-family:var(--serif);font-size:17px;line-height:1.55;font-style:italic}
/* chats list */
.trow{display:flex;gap:12px;align-items:center;padding:11px 16px;width:100%;text-align:left}
.trow:active{background:var(--panel)}
.trow .avs{position:relative;width:52px;height:52px;flex:none}
.trow .avs .av{position:absolute;width:52px;height:52px}
.trow .avs.two .av{width:38px;height:38px}
.trow .avs.two .av:last-child{right:0;bottom:0;border:2px solid var(--bg)}
.trow b{font-size:14.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow p{font-size:12.5px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow time{font-size:10.5px;color:var(--faint)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rose);flex:none}

/* living chat backdrop */

.cbimg img{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;object-position:50% 20%;opacity:0;transition:opacity 1.2s ease;animation:cbdrift 26s ease-in-out infinite alternate;filter:saturate(.9)}
.cbimg img.on{opacity:.85}
.cbimg .cbv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease}#cbImg.duo img{width:78%;inset:auto;top:0;height:100%;transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.8,.2,1),filter 1.2s ease;animation:none}

#cbImg.duo img.back{z-index:1;filter:brightness(.4) blur(1.5px);transform:scale(.94) translateY(3%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 20%,#000 80%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 20%,#000 80%,transparent 100%)}
#cbImg.duo img.on.back{opacity:.7}

.cbimg img.pulse{animation:cbdrift 26s ease-in-out infinite alternate,cbpulse .9s ease}
@keyframes cbdrift{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.12) translate(-2%,-2%)}}
@keyframes cbpulse{0%{filter:brightness(1)}40%{filter:brightness(1.25)}100%{filter:brightness(1)}}
#cbFx{position:absolute;inset:0;width:100%;height:100%}
.cbveil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,11,16,.45) 0%,rgba(12,11,16,.1) 28%,rgba(12,11,16,.5) 62%,rgba(12,11,16,.9) 100%)}

/* 2026-10-27 · Ann：「浏览器整个卡死，连字都打不进去」。
   backdrop-filter 是合成器杀手：**每一个**气泡都要对自己的背景做一次模糊快照，
   一屏 6–8 个、滚动列表里 60+ 个 ⇒ Windows/Edge 上是已知的合成器停摆（页面不再响应输入，
   而 JS 长任务还是 0 —— 和我们量到的「长任务 0 / 60fps」完全吻合）。
   ⇒ 默认**关**，只留便宜的半透明底；想要毛玻璃就把 body 加上 heavyfx 类。 */
body.heavyfx .chatscreen .bub{background:rgba(22,20,28,.82);backdrop-filter:blur(8px)}
.mquick{display:flex;gap:4px;margin:3px 0 0 40px}.mquick.c{justify-content:center;margin-left:0}

.m-row+.mquick{margin-left:40px}
#spBg{transition:transform 1.4s cubic-bezier(.2,.8,.2,1),filter 1.2s ease}
#cbImg{position:absolute;inset:0;transition:transform 1.4s cubic-bezier(.2,.8,.2,1),filter 1.2s ease}
#cbImg.p-close,#spBg.p-close{transform:scale(1.32) translateY(9%)}
#cbImg.p-smile,#spBg.p-smile{transform:scale(1.1) translateY(2%);filter:brightness(1.18) saturate(1.1)}
#cbImg.p-angry,#spBg.p-angry{transform:scale(1.18) translateY(4%);filter:contrast(1.25) saturate(1.3) sepia(.25) hue-rotate(-18deg);animation:cbshake .45s}
#cbImg.p-sad,#spBg.p-sad{transform:scale(1.04) translateY(-3%);filter:grayscale(.55) brightness(.75)}
#cbImg.p-away,#spBg.p-away{transform:scaleX(-1) scale(1.06) translateX(6%);filter:brightness(.62) blur(1.5px)}
#cbImg.p-surprised,#spBg.p-surprised{transform:scale(1.22) translateY(5%);animation:cbpunch .5s}
#cbImg.p-think,#spBg.p-think{transform:scale(1.12) translateX(-5%);filter:brightness(.8) blur(.8px)}
@keyframes cbshake{0%,100%{translate:0}20%{translate:-8px 0}40%{translate:7px 0}60%{translate:-5px 0}80%{translate:3px 0}}

.gc-herocap h1{font-family:'Arial Black',system-ui;font-size:30px;letter-spacing:.04em;background:linear-gradient(180deg,#FFF1C9,#F0B77E 55%,#EE6F97);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px rgba(238,111,151,.5))}
.gcm-hero h1{font-size:24px}
.gc-herocap p{font-size:12px;color:var(--dim);margin-top:2px}
.gc-body{padding:0 16px}
.gc-pair{margin-top:14px}
.gc-pairs{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.gc-pb{flex:none;display:flex;padding:4px 8px 4px 4px;border-radius:999px;background:var(--panel2);border:1.5px solid var(--line)}
.gc-pb .av{margin-right:-6px;border:2px solid var(--panel2)}
.gc-pb.on{border-color:var(--rose);background:rgba(238,111,151,.12)}
.relb{margin-top:8px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line2)}
.relm{height:8px;border-radius:4px;background:var(--line2);margin-top:8px;overflow:hidden}
.relm i{display:block;height:100%;background:var(--grad);border-radius:4px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.gc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.gc-card{text-align:left;display:block;background:var(--panel);border:1px solid var(--line2);border-radius:18px;overflow:hidden}
.gc-card.mini{width:130px;background:none;border:none;position:relative}
.gc-poster{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:inherit}
.gc-card.mini .gc-poster{border-radius:16px}
.gc-poster img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.gc-pv{position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(10,8,14,.92))}
.gc-pt{position:absolute;left:10px;right:10px;bottom:10px;font-size:21px;line-height:1.05;color:transparent;text-shadow:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.7))}
.gc-card.mini .gc-pt{font-size:17px}
.gc-info{padding:10px 12px 12px}
.gc-info b{font-size:14px}
.gc-info p{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gc-tag{display:inline-block;margin-top:6px;font-size:9.5px;font-weight:900;letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:var(--raise);color:var(--dim)}
.gc-card.mini .gc-tag{position:absolute;top:8px;left:8px;margin:0;background:rgba(10,8,14,.7)}
.gc-tag.daily{color:var(--gold)}.gc-tag.party{color:var(--rose)}
.gh-gc{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,rgba(156,132,224,.3),rgba(238,111,151,.25));border:1px solid rgba(238,111,151,.4)}
.gh-gc span{font-weight:900;font-size:15px}.gh-gc small{flex:1;font-size:11px;color:var(--dim)}.gh-gc b{font-size:20px}
.gscr{padding-bottom:30px}
.gres{margin:16px;padding:14px;border-radius:18px;background:var(--panel);border:1px solid rgba(240,183,126,.3);animation:up .4s}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
/* found phone */
.ph{display:flex;justify-content:center;padding:6px 16px}
.ph-scr{width:260px;height:520px;border-radius:40px;border:8px solid #1a1820;background:#000;overflow:hidden;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 0 1px #3a3645}
.ph-lock{position:absolute;inset:0;background:center/cover;display:flex;flex-direction:column;align-items:center;padding-top:36px}
.ph-lock::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px)}
.ph-lock>*{position:relative}
.ph-time{font-size:52px;font-weight:300;letter-spacing:-.02em}
.ph-date{font-size:12px;opacity:.85}
.ph-noti{margin-top:14px;width:88%;background:rgba(40,38,48,.75);backdrop-filter:blur(10px);border-radius:14px;padding:8px 10px;font-size:11px;display:grid;gap:2px}
.ph-dots{margin-top:14px;letter-spacing:.35em;font-size:14px}
.ph-dots.shake{animation:shake .4s;color:var(--danger)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ph-pad{display:grid;grid-template-columns:repeat(3,56px);gap:10px;margin-top:12px}
.ph-pad button{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);font-size:20px;color:#fff}
.ph-pad button:active{background:rgba(255,255,255,.35)}
.ph-app{position:absolute;inset:0;background:#0d0d10;overflow-y:auto;padding:28px 10px 10px}
.ph-hd{font-size:20px;font-weight:800;padding:0 4px 8px;display:block;text-align:left;color:#fff}
.ph-hd.back{font-size:15px;color:#6aa9ff}
.ph-row{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 4px;border-bottom:1px solid #222;position:relative}
.ph-row b{display:block;font-size:13px}.ph-row span{display:block;font-size:11px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.ph-row .dot{width:8px;height:8px;border-radius:50%;background:#3b82f6}
.ph-row.dim{opacity:.5}
.ph-row em,.ph-photo em{font-style:normal;font-size:12px}
.ph-sec{font-size:11px;color:#777;margin:14px 4px 4px;text-transform:uppercase;letter-spacing:.08em}
.ph-photo{position:relative;display:block;width:100%;height:120px;border-radius:12px;overflow:hidden}
.ph-photo img{width:100%;height:100%;object-fit:cover}
.ph-photo em{position:absolute;inset:auto 8px 8px auto;background:rgba(0,0,0,.6);padding:4px 8px;border-radius:8px}
.ph-photo.lk img{filter:blur(14px) brightness(.7)}
.blur{filter:blur(4px)}
.ph-th{display:flex;flex-direction:column;gap:6px;padding:6px 2px}
.ph-b{max-width:78%;padding:7px 11px;border-radius:16px;font-size:12.5px;animation:up .3s both}
.ph-b.a{align-self:flex-end;background:#2f7cf6;color:#fff}.ph-b.b{align-self:flex-start;background:#26252b}
.ph-typing{font-size:10.5px;color:#888;margin-top:4px}
/* letter rush */
.rush{position:relative;height:420px;margin:12px 16px;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#2a1830,#120d18);border:1px solid var(--line)}
.rush-hud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;z-index:3;font-weight:900}
.rush-hud b{font-size:24px;color:var(--gold)}
.rush-go{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3}
.lt{position:absolute;top:-60px;width:92px;padding:10px 6px;border-radius:6px;background:#f6ecd9;color:#553;font-size:11px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.4);animation:fall linear forwards;transform:rotate(-6deg)}
.lt.real{background:#fff1f5;border:1.5px solid var(--rose)}
.lt.got{animation:none;transform:scale(1.3);opacity:0;transition:.25s}
.lt.bad{animation:none;background:var(--danger);opacity:0;transition:.25s}
@keyframes fall{to{top:440px;transform:rotate(8deg)}}
/* capsule */
.cap-m{display:grid;justify-items:center;padding:12px 16px}
.cap-dome{position:relative;width:220px;height:200px;border-radius:110px 110px 20px 20px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(255,255,255,.06) 45%),rgba(156,132,224,.15);border:3px solid rgba(255,255,255,.25);overflow:hidden}
.cap-dome i{position:absolute;width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,hsl(var(--h),80%,72%) 50%,#fff 50%);box-shadow:inset -4px -4px 8px rgba(0,0,0,.2)}
.cap-dome.spin i{animation:jig .25s infinite alternate}
@keyframes jig{to{transform:translate(6px,-10px) rotate(40deg)}}
.cap-base{width:240px;height:120px;border-radius:14px;background:linear-gradient(180deg,#EE6F97,#b0406a);display:flex;align-items:center;justify-content:space-around;margin-top:-4px}
.cap-knob{width:64px;height:64px;border-radius:50%;background:#fff;color:#b0406a;font-weight:900;font-size:13px;box-shadow:0 4px 0 #7a2a48;transition:transform 1.4s}
.cap-slot{width:70px;height:60px;border-radius:10px;background:rgba(0,0,0,.35);display:grid;place-items:center}
.cap-ball{width:44px;height:44px;border-radius:50%;background:linear-gradient(180deg,hsl(var(--h),80%,72%) 50%,#fff 50%);animation:drop .5s}
@keyframes drop{from{transform:translateY(-40px)}}
.cap-prize{display:grid;gap:6px;margin-top:8px}
.cap-prize img{width:100%;max-height:220px;object-fit:cover;object-position:center 20%;border-radius:14px}
.cap-prize p{font-family:var(--serif);font-size:15px}
/* remember */
.rem{margin:12px 16px;display:grid;gap:8px}
.rem-h{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;font-weight:800}
.rem-h span{display:flex;gap:6px;align-items:center}
.rem-r{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;padding:10px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line2);font-size:12.5px;line-height:1.45}
.rem-r p:first-child{border-right:1px dashed var(--line);padding-right:8px}
.rem-r.hit{border-color:var(--mint);background:rgba(127,196,166,.1)}
.rem-r.miss{border-color:var(--danger);opacity:.6}
/* phone call */
.callv{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;padding:60px 20px 34px;animation:up .35s}
.cv-bg{position:absolute;inset:0;background:center 20%/cover;filter:blur(18px) brightness(.5);transform:scale(1.2)}
.cv-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,7,11,.3),rgba(8,7,11,.9))}
.callv>*:not(.cv-bg):not(.cv-veil){position:relative}
.cv-top{display:grid;justify-items:center;gap:4px}.cv-top b{font-size:22px}.cv-top span{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.cv-av{margin-top:30px;display:grid;justify-items:center;gap:14px}
.cv-av .av{box-shadow:0 0 0 6px rgba(255,255,255,.08),0 0 0 14px rgba(255,255,255,.04)}
.cv-wave{display:flex;gap:4px;height:26px;align-items:center}
.cv-wave i{width:4px;height:6px;border-radius:2px;background:var(--rose)}
.cv-wave.on i{animation:wv .8s infinite ease-in-out}
.cv-wave.on i:nth-child(2){animation-delay:.1s}.cv-wave.on i:nth-child(3){animation-delay:.2s}.cv-wave.on i:nth-child(4){animation-delay:.3s}.cv-wave.on i:nth-child(5){animation-delay:.4s}
@keyframes wv{50%{height:24px}}
.cv-line{margin-top:22px;text-align:center;font-family:var(--serif);font-size:17px;line-height:1.5;max-width:300px;min-height:52px}
.cv-rep{margin-top:auto;display:grid;gap:8px;width:100%}
.cv-rep button{padding:11px 14px;border-radius:14px;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);font-size:13.5px;text-align:left}
.cv-bot{display:flex;gap:40px;margin-top:18px}
.cv-b{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);font-size:22px;display:grid;place-items:center;position:relative}
.cv-b small{position:absolute;bottom:-18px;font-size:10.5px;color:var(--dim);white-space:nowrap}
.cv-b.on{background:#fff;color:#000}
.cv-b.end{background:#E3485A}
/* fan board */
.fanh{padding-top:10px}
.fan3{display:flex;align-items:flex-end;justify-content:center;gap:12px;padding:16px 0 10px}
.f3{display:grid;justify-items:center;gap:4px;flex:1;max-width:110px;padding:10px 4px;border-radius:16px;background:var(--panel)}
.f3.r1{background:linear-gradient(180deg,rgba(240,183,126,.2),var(--panel));padding-top:16px}
.f3 span{font-size:20px}.f3 b{font-size:11.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.f3 em{font-style:normal;font-size:11px;color:var(--gold)}
.f3.me{outline:1.5px solid var(--rose)}
.frow .rk{width:22px;text-align:center;color:var(--faint);font-weight:800}
.frow em{font-style:normal;font-size:12px;color:var(--dim)}
.frow.me{background:rgba(238,111,151,.1);border-radius:10px;padding-inline:6px}

.adbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(127,196,166,.1);border:1px solid rgba(127,196,166,.4)}
.adbtn .adic{width:30px;height:30px;border-radius:50%;background:var(--mint);color:#0c1a14;display:grid;place-items:center;font-size:12px}
.adbtn b{display:block;font-size:13.5px}.adbtn small{font-size:10.5px;color:var(--dim)}
.adbtn em{font-style:normal;font-size:9px;font-weight:900;padding:2px 5px;border-radius:4px;border:1px solid var(--faint);color:var(--faint)}
.adbtn[disabled]{opacity:.45}
.adv{position:absolute;inset:0;z-index:95;background:#000;display:flex;flex-direction:column}
.adv-top{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:8px;align-items:center;z-index:2}
.adv-tag{font-size:10px;font-weight:800;background:rgba(255,255,255,.2);padding:3px 8px;border-radius:6px}
.adv-t{margin-left:auto;width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.5);display:grid;place-items:center;font-size:12px;font-weight:800}
.adv-x{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.15);color:rgba(255,255,255,.35)}
.adv-x.on{background:#fff;color:#000}
.adv-art{flex:1;background:center/cover;filter:saturate(1.1)}
.adv-cap{position:absolute;left:16px;right:16px;bottom:40px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);padding:12px 14px;border-radius:14px}
.adv-cap b{font-size:15px}.adv-cap p{font-size:11.5px;color:var(--dim);margin-top:3px}
.adv-bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.15)}
.adv-bar i{display:block;height:100%;width:0;background:var(--mint);transition:width 1s linear}

/* ---- home v3: smaller circles/chips, bigger drama, centre card pops ---- */
.story .av{width:46px;height:46px;border-width:2px}
.story .sdot{position:absolute;top:2px;right:4px;width:10px;height:10px;border-radius:50%;background:var(--rose);border:2px solid var(--bg)}
@keyframes dkpop{0%{transform:scale(.86)}60%{transform:scale(1.09)}100%{transform:scale(1.04)}}
/* ---- onboarding big-image chooser ---- */
.orT{position:relative;display:block;width:100%;height:210px;margin-top:16px;border-radius:22px;overflow:hidden;text-align:left;border:2px solid transparent;transition:transform .2s,border-color .2s}
.orT:active{transform:scale(.98)}
.orT.on{border-color:var(--rose);box-shadow:0 0 0 4px rgba(238,111,151,.2)}
.orI{position:absolute;inset:0;display:flex}
.orI img{flex:1;min-width:0;height:100%;object-fit:cover;object-position:center 22%}
.orV{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,7,11,0) 35%,rgba(8,7,11,.92))}
.orT:not(.on) .orI{filter:saturate(.75) brightness(.8)}
.orL{position:absolute;left:14px;right:14px;bottom:12px}
.orL b{display:block;font-size:30px;font-family:var(--serif);line-height:1}
.orL span{display:block;font-size:11.5px;color:var(--dim);margin-top:4px}
.orT.big{height:250px}
.orT.big .orL b{font-size:44px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.orHot{position:absolute;top:12px;left:12px;font-size:11px;font-weight:900;padding:4px 9px;border-radius:999px;background:var(--rose);color:#1B1017}
.orC{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.5);color:transparent}
.orT.on .orC{background:var(--rose);border-color:var(--rose);color:#1B1017}
.orRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.orRow .orT{height:190px;margin-top:10px}
.orRow .orL b{font-size:22px}
.orGl{display:block;margin:14px auto 0;font-size:12.5px;color:var(--dim);padding:6px 12px;border-radius:999px}
.orGl.on{color:var(--rose);background:rgba(238,111,151,.1)}
/* ---- coach marks ---- */
.coach{position:absolute;inset:0;z-index:120;pointer-events:none}
.coach-hole{position:absolute;border-radius:16px;box-shadow:0 0 0 3000px rgba(6,5,9,.78);transition:all .35s cubic-bezier(.2,.8,.2,1);pointer-events:none;outline:2px solid rgba(240,183,126,.8);outline-offset:3px}
.coach-hole::after{content:"";position:absolute;inset:-8px;border-radius:20px;border:2px solid rgba(240,183,126,.5);animation:cring 1.4s infinite}
@keyframes cring{from{opacity:1;transform:scale(.96)}to{opacity:0;transform:scale(1.08)}}
.coach-tip{position:absolute;left:16px;right:16px;background:var(--panel2);border:1px solid rgba(240,183,126,.4);border-radius:18px;padding:14px 16px;box-shadow:0 12px 40px rgba(0,0,0,.6);animation:up .3s;pointer-events:auto}
.coach-tip b{display:block;font-size:15px}
.coach-tip p{font-size:12.5px;color:var(--dim);line-height:1.55;margin-top:4px}
.coach-tip .row{margin-top:12px;gap:8px;align-items:center}
.coach-tip small{color:var(--faint);font-size:11px}
.coach-skip{font-size:12px;color:var(--faint);padding:6px 4px}

/* ---- story link layer ---- */
.pairchip b{margin-left:8px;color:var(--gold)}.pairchip em{font-style:normal}
@keyframes cbp{0%,100%{box-shadow:0 4px 14px rgba(47,166,110,.45)}50%{box-shadow:0 4px 22px rgba(95,211,154,.8)}}
.cv-meter{position:relative;margin-top:10px;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12)}
.pz{margin-top:14px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,rgba(156,132,224,.14),rgba(20,18,26,.9));border:1px solid rgba(156,132,224,.35)}
.pz b{font-size:14px}.pzn{font-size:20px;font-weight:900;color:var(--violet)}
.pzs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0}
.pzs i{aspect-ratio:1;border-radius:10px;border:1.5px dashed var(--line);display:grid;place-items:center;font-style:normal;color:var(--faint);font-weight:900}
.pzs i.on{border:1.5px solid var(--violet);background:rgba(156,132,224,.2)}
.pzt{font-family:var(--serif);line-height:1.5}
.clueget{margin:8px 0 4px;padding:8px 10px;border-radius:10px;background:rgba(156,132,224,.18);font-size:12.5px;font-weight:800;animation:up .4s}
.clueget.v{background:rgba(238,111,151,.14)}
.gc-sec{margin:20px 0 -4px;font-size:13px;font-weight:900;color:var(--dim)}
.gc-done{position:absolute;top:8px;right:8px;z-index:2;font-size:16px}
.gc-tag.story{color:var(--violet)}
.ev{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 16px}
.evc{position:relative;min-height:120px;padding:12px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:left;overflow:hidden}
.evc i{font-style:normal;font-size:28px}.evc span{display:block;font-size:11px;color:var(--faint);margin-top:6px}
.evc p{display:none;font-size:12.5px;line-height:1.45;margin-top:6px}
.evc.on{border-color:rgba(240,183,126,.5);background:linear-gradient(180deg,rgba(240,183,126,.08),var(--panel))}.evc.on span{display:none}.evc.on p{display:block;animation:up .3s}
.evq{margin:0 16px;display:grid;gap:8px}.evq b{font-size:15px}
.btn.ok{border-color:var(--mint)!important;background:rgba(127,196,166,.18)!important}.btn.bad{border-color:var(--danger)!important;opacity:.7}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 16px}
.pgi{aspect-ratio:3/4;border-radius:14px;background-size:260%;border:2px solid transparent;filter:sepia(.25)}
.pgi.ok{border-color:var(--mint);filter:none}.pgi.bad{border-color:var(--danger);animation:shake .4s}
.kwant{display:flex;gap:10px;justify-content:center;margin:12px 0}
.kwant span{width:46px;height:46px;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:24px;filter:grayscale(1) opacity(.5)}
.kwant span.on{filter:none;border:1.5px solid var(--gold);background:rgba(240,183,126,.15)}
.kroom{position:relative;height:380px;margin:0 16px;border-radius:20px;overflow:hidden;background:center/cover}
.kveil{position:absolute;inset:0;background:rgba(12,10,16,.62)}
.kit{position:absolute;font-size:30px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));transition:transform .2s}

/* ---- memory space ---- */

.callbtn{display:flex;align-items:center;gap:4px;padding:6px 9px;border-radius:999px;background:linear-gradient(135deg,#5FD39A,#2FA66E);color:#062015;font-weight:900;font-size:11px;box-shadow:0 4px 14px rgba(47,166,110,.45);margin-right:4px;animation:cbp 2.4s infinite;white-space:nowrap;flex:none}

.wtk{position:relative;height:26px;margin:4px 16px 4px;border-radius:10px;background:var(--panel);border:1px solid var(--line2);overflow:hidden}.wtki{position:absolute;inset:0;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:11px;opacity:0;transform:translateY(100%);transition:opacity .4s,transform .4s;text-align:left}

.dre .dreai{font-style:normal;font-size:10px;color:#9fd4ff;font-weight:700}
.dre[data-dre="night"]{border-color:rgba(240,183,126,.45);background:linear-gradient(135deg,rgba(240,183,126,.12),rgba(238,111,151,.08))}
.drnote{font-size:11.5px;color:var(--dim,#aaa);margin:10px 2px 0;line-height:1.5}

.chatscreen .m-row.me .bub{background:var(--grad)!important;color:#1B1017!important;-webkit-backdrop-filter:none;backdrop-filter:none!important}
.chatscreen .m-row.me .bub *{color:#1B1017}
.pkme .pkmen{display:block;font-size:10px;font-weight:800;opacity:.7;margin-bottom:2px;letter-spacing:.04em}
#s-story .tabs{padding-left:56px}
.mi-short{display:flex;align-items:center;gap:8px;justify-content:center;width:calc(100% - 24px);margin:12px;padding:12px;border-radius:14px;background:linear-gradient(135deg,#F0B77E,#EE6F97);color:#1B1017;font-weight:800;font-size:14px;border:0}

.chq{text-align:center;font-size:12px;color:#EDE7F1;margin:8px 0 6px;font-weight:700;letter-spacing:.04em}
.chatt{display:grid;gap:8px}
.chatt button{display:grid;gap:3px;text-align:left;padding:10px 13px;border-radius:14px;background:rgba(18,16,26,.82);border:1px solid color-mix(in srgb,var(--ac) 55%,transparent);color:#fff}
.chatt button b{font-size:13px;color:var(--ac)}
.chatt button span{font-size:13.5px;line-height:1.45;color:#E9E2EE}
.chstep{background:rgba(18,16,26,.85);border:1px solid color-mix(in srgb,var(--ac) 55%,transparent);border-radius:16px;padding:12px;display:grid;gap:8px}
.chh{display:flex;align-items:center;justify-content:space-between}.chh b{color:var(--ac);font-size:14px}
.chback{font-size:12px;color:#CFC6D8;background:rgba(255,255,255,.06);border-radius:99px;padding:4px 10px;border:0}
.chl{font-size:11px;color:#B7AEC2;margin:2px 0 -2px}
.chacts{display:flex;flex-wrap:wrap;gap:6px}
.chacts button{font-size:12px;padding:5px 10px;border-radius:99px;background:rgba(240,183,126,.12);border:1px solid rgba(240,183,126,.35);color:#F0B77E}
.chacts button.on{background:#F0B77E;color:#1B1017;font-weight:700}
#chTxt{width:100%;box-sizing:border-box;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);border-radius:10px;color:#fff;padding:9px 10px;font-size:14.5px;line-height:1.45;resize:none;font-family:inherit}

.scurt{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(6,5,9,.0);backdrop-filter:blur(0);pointer-events:none;transition:background .6s ease,backdrop-filter .6s ease}
.scurt.on{background:rgba(6,5,9,.62);backdrop-filter:blur(6px)}
.scin{text-align:center;opacity:0;transform:translateY(10px) scale(.98);transition:opacity .6s ease .1s,transform .6s ease .1s;padding:0 24px}
.scurt.on .scin{opacity:1;transform:none}
.scin small{display:block;font-size:11px;letter-spacing:.32em;color:#F0B77E;margin-bottom:10px}
.scin b{display:block;font-family:var(--serif);font-size:26px;line-height:1.3;color:#fff;letter-spacing:.04em}
.scin em{display:block;margin-top:8px;font-style:normal;font-size:13px;color:#D8CFE0;letter-spacing:.12em}
.chatscreen .m-scene{display:grid!important;gap:4px;justify-items:center;text-align:center;padding:14px 18px!important;margin:18px auto 6px!important;border-radius:16px!important;background:rgba(10,9,14,.62)!important;border:1px solid rgba(240,183,126,.35)!important}
.chatscreen .m-scene span{font-family:var(--serif);font-size:19px!important;color:#FFE2C4!important;letter-spacing:.03em}
.chatscreen .m-scene em{font-size:12px!important;color:#D8CFE0!important;letter-spacing:.1em}
