const numDone=steps.slice(0,-1).filter(s=>!!wizard.answers?.[steps.indexOf(s)]).length;
const picked=wizard.selections?.[step.key]||[];const note=wizard.custom?.[step.key]||'';
const sections=GROUPS.map(g=>{const first=steps.findIndex(x=>x.group===g),last=steps.reduce((a,x,i)=>x.group===g?i:a,0);const done=steps.slice(first,last+1).filter((x,i)=>wizard.answers[first+i]).length;return `<button class="wizardPhase ${g===step.group?'active':''} ${idx>last?'passed':''}" data-wizard-jump="${first}"><span>${done===last-first+1?'✓':GROUPS.indexOf(g)+1}</span><small>${g}</small></button>`}).join('');
const canBack=idx>0;
if(step.type==='review')return `<div class="wizardShell"><div class="wizardTop"><span class="wizardLabel">✦ STORY READY</span><span class="pill">${numDone} / ${steps.length-1} 已填写</span></div><div class="phaseLine">${sections}</div><div class="assistantMascot">✦</div><div class="assistantPrompt"><b>${esc(step.title)}</b><p>${esc(step.desc)}</p></div><div class="reviewCards">${GROUPS.map(g=>{const groupSteps=steps.filter(x=>x.group===g&&x.key!=='review');return `<div class="reviewCard"><div class="row"><b>${g}</b><button data-wizard-jump="${steps.indexOf(groupSteps[0])}">修改 ↗</button></div>${groupSteps.map(t=>`<div><span>${esc(t.title)}</span><p>${esc(wizard.answers[steps.indexOf(t)]||'未设置（可随时补充）')}</p></div>`).join('')}</div>`}).join('')}</div><div class="wizardBottom">${$btn('wizard-prev','← 上一步','btn')}${$btn('wizard-finish','✨ 完成创建并试玩','btn primary')}</div><div class="guideExtra">${$btn('pro','⌘ 转专业模式细调','btn full')}${$btn('export','⇩ 导出完整数据','btn full')}</div></div>`;
return `<div class="wizardShell"><div class="wizardTop"><span class="wizardLabel">AI GUIDED CREATION</span><span class="pill">${idx+1} / ${steps.length-1}</span></div><div class="phaseLine">${sections}</div><div class="wizardProgress"><span style="width:${Math.round(idx/(steps.length-1)*100)}%"></span></div><div class="assistantMascot">✦</div><div class="assistantPrompt"><small>${esc(step.group)}</small><b>${esc(step.title)}</b><p>${esc(step.desc)}</p>${step.type==='multi'?'<em>☑ 可多选，也可补充自己的想法</em>':step.type==='single'?'<em>◉ 单选，也可以输入自定义内容</em>':'<em>✎ 可直接语音输入或请 AI 帮忙构思</em>'}</div>
${step.chips?.length?`<div class="wizardOptions ${step.type==='multi'?'multi':''}">${step.chips.map(c=>`<button data-wizard-option="${esc(c)}" class="wizardOption ${picked.includes(c)?'selected':''}"><span class="checkMark">${picked.includes(c)?'✓':step.type==='multi'?'＋':'○'}</span><span>${esc(c)}</span></button>`).join('')}</div>`:''}
<div class="wizardEntry"><label>✎ ${step.type==='text'?'补充你的故事想法':'其他要求（可选）'}</label><textarea id="wizardText" rows="3" data-wizard-custom="${step.key}" placeholder="${esc(step.hint||'你还想加什么？例如：剧情必须发生在纽约、同时出现三个男主……')}">${esc(note)}</textarea><div class="wizardTools"><button class="miniTool" data-action="voice">🎤 语音输入</button><button class="miniTool aiTool" data-action="wizard-ai">✨ AI 帮我生成 <span>💎 2</span></button><button class="miniTool" data-action="wizard-inspire">↻ 换个灵感</button></div></div>
${picked.length?`<div class="chosenHint">已选 ${picked.length} 项：${picked.map(x=>esc(x)).join(' · ')}</div>`:''}
<div class="wizardBottom">${$btn('wizard-prev','← 返回','btn',''+(!canBack?'disabled':''))}${$btn('wizard-next',idx===steps.length-2?'确认并总览 →':'保存并继续 →','btn primary')}
</div><div class="guideExtra">${$btn('wizard-skip','暂时跳过，之后补充','btn ghost sm')}${$btn('wizard-review','查看完整配置','btn ghost sm')}</div><div class="guideFinePrint">所有设置保存在当前作品中，可在「故事编辑」「专业版」继续修改。离线 AI 灵感为模板演示；接入 API 后可替换为真正模型生成。宝石为本地模拟余额。</div></div>`}
function worksView(){const list=Object.values(shelf).sort((a,b)=>(b.project?.updatedAt||0)-(a.project?.updatedAt||0));return `<div class="panelTop"><div><h2>🗂 我的创作草稿</h2><p>在同一浏览器保存多个作品。公开 / 私有 / 草稿状态仅本地演示。</p></div>${$btn('templates','＋ 创建新作品','btn sm primary')}</div><div class="section">${list.length?list.map(w=>{const q=w.project;return `<div class="thinCard"><div class="row"><div><h4>${esc(q.title)} ${q.id===p.id?'· 正在编辑':''}</h4><p>${esc(q.premise)}</p></div><span class="pill">${q.published?'可演示':'草稿'}</span></div><div class="tagGroup"><span class="tag">${esc(q.genre||'自由')}</span><span class="tag">${(q.extraCast||[]).length+2} 个角色</span><span class="tag">${new Date(q.updatedAt||Date.now()).toLocaleDateString('zh-CN')}</span></div><div class="proToolbar" style="margin-top:12px"><button class="btn sm primary" data-select-work="${esc(q.id)}">打开继续写</button><button class="btn sm" data-clone-work="${esc(q.id)}">复制草稿</button><button class="btn sm ghost" data-delete-work="${esc(q.id)}">删除本地草稿</button></div></div>`}).join(''):'<p>还没有草稿。</p>'}<div class="helpOverlay">为了安全与迁移，建议随时导出 JSON。浏览器本地草稿没有云端备份。</div></div>`}
function openWork(id){const w=shelf[id];if(!w)return toast('作品不存在');p=clone(w.project);wizard=clone(w.wizard||{answers:[],step:0,complete:false,feedback:{}});wizard.selections ||= {};wizard.custom ||= {};wizard.answers ||= [];sourcebook=clone(w.sourcebook||[]);currentScene='start';makeEngine();save();setTab('draft');toast('已打开：'+p.title)}
function templates(){const f=['全部','危险恋爱','BL / 校园','群像','生存','温柔','开放'];return `<div class="panelTop"><div><h2>选一个有感觉的开头</h2><p>只是一颗种子。角色、背景、悬念都可以再修改。</p></div><span class="pill">8 个演示模板</span></div><div class="templateFilters">${f.map(x=>`<button data-filter="${esc(x)}" class="chip ${filter===x?'chosen':''}">${esc(x)}</button>`).join('')}</div><div class="templateGrid">${D.TEMPLATES.filter(t=>filter==='全部'||(filter==='危险恋爱'&&['vampire','mafia'].includes(t.id))||(filter==='BL / 校园'&&t.id==='campus')||(filter==='群像'&&t.id==='wolf')||(filter==='生存'&&t.id==='survival')||(filter==='温柔'&&['room','idol'].includes(t.id))||(filter==='开放'&&t.id==='open')).map(t=>`<button class="templateCard" data-template="${t.id}"><div class="templateArt">${t.emoji}</div><strong>${esc(t.title)}</strong><p>${esc(t.desc)}</p><span>${esc(t.genre)} · 开始创作 →</span></button>`).join('')}</div>`}
function draft(){const tabs=[['story','📖 故事'],['cast','👤 人物'],['world','🌏 世界'],['chapters','🧭 章节'],['prompt','🧠 Prompt'],['release','🚀 发布']];return `<div class="draftHead"><div class="cover">${D.chooseTemplate(p.templateId).emoji}</div><div><h2>${esc(p.title)}</h2><p>${esc(p.premise)}<br>所有内容都可随时修改，右上角即可试玩。</p></div></div><div class="tabs">${tabs.map(([k,n])=>`<button class="${draftTab===k?'active':''}" data-draft="${k}">${n}</button>`).join('')}</div><div class="section">${draftTab==='story'?storyForm():draftTab==='cast'?castForm():draftTab==='world'?worldForm():draftTab==='chapters'?chaptersForm():draftTab==='prompt'?promptForm():releaseForm()}</div>`}
function storyForm(){return `<div class="sectionTitle">一句话，让玩家想马上进入</div>${field('故事标题','title')}${field('一句话钩子','hook','textarea','第一幕最好就出现矛盾、危险或特别的情感时刻')}${field('故事简介','premise','textarea')}${field('故事核心矛盾','conflict','textarea')}${field('理想体验','vibe')}${field('结局方向（不锁死分支）','ending','textarea')}${$btn('rewrite-hook','✨ 帮我润色开场','btn primary')}`}
function castForm(){return `<div class="sectionTitle">谁会让人忍不住继续聊？</div><div class="thinCard"><h4>💜 角色 1 · 主要人物</h4>${nested('名字','lead.name')}${nested('身份','lead.role')}${nested('性格与反差','lead.personality','','textarea')}${nested('他真正想得到什么','lead.goal')}${nested('不可越过的边界','lead.boundary')}</div><div class="thinCard"><h4>🩶 角色 2 · 知情者 / 对手</h4>${nested('名字','support.name')}${nested('身份','support.role')}${nested('性格','support.personality','','textarea')}${nested('目标','support.goal')}</div><div class="sectionTitle">👥 其他人物（适合多人剧情）</div>${(p.extraCast||[]).map((c,i)=>`<div class="thinCard"><div class="row"><h4>角色 ${i+3} · ${esc(c.name)}</h4>${$btn('extra-del-'+i,'删除','btn sm')}</div><div class="fieldRow"><div class="field"><label>姓名</label><input data-extra-field="${i}.name" value="${esc(c.name)}"></div><div class="field"><label>身份</label><input data-extra-field="${i}.role" value="${esc(c.role)}"></div></div><div class="field"><label>性格</label><textarea data-extra-field="${i}.personality">${esc(c.personality)}</textarea></div><div class="field"><label>欲望</label><input data-extra-field="${i}.goal" value="${esc(c.goal)}"></div></div>`).join('')}${$btn('extra-add','＋ 添加第三人 / 更多人物','btn sm primary')}${field('玩家身份（可选择做自己）','playerRole','textarea')}${field('玩家个性 / 双向人设','playerPersona','textarea')}${field('关系张力','relationship','textarea')}`}
function worldForm(){return `<div class="sectionTitle">让设定真正影响剧情</div>${field('故事发生的世界','world','textarea')}${field('关键物品或线索','object')}${field('尚未公开的真相','secret','textarea','默认仅特定角色知道，不自动共享到玩家或其他 NPC')}${$btn('sourcebook','📚 继续补充世界资料库','btn sm')}<div class="helpOverlay">每个角色只会获知授权的事实。专业模式可单独编辑角色知识、道具、时间线与信息披露规则。</div>`}
function chaptersForm(){const s=getStory();return `<div class="sectionTitle">第一章 · 自动生成的剧情骨架</div><p class="small muted">不是把五十万字塞进对话框，而是把剧情拆成有因果后果的可执行场景。</p><div class="sceneTimeline">${s.nodes.map((n,i)=>`<div class="${n.id===currentScene?'current':''}"><button class="sceneJump" data-scene="${n.id}"><b>${i+1}. ${esc(n.title)}</b></button><small> · ${n.choices.length} 条选择 · ${n.minTurns}-${n.maxTurns} 轮</small></div>`).join('')}</div>${$btn('pro','⌘ 高级修改分支节点','btn primary')}`}

function compilePrompt(){const story=getStory();const rules=story.interactions.map(r=>`${r.id}: ${r.when} @ ${r.scene||'任意场景'}, 互动 ${r.interaction}, ${r.once?'仅一次':'按冷却重复'}`).join('\n');const roles=story.cast.map(c=>{const facts=story.facts.filter(f=>(f.initiallyKnownTo||[]).includes(c.id)).map(f=>f.text).join('；')||'没有私有知识';return `角色：${c.name}（${c.role}）\n性格：${c.personality}\n核心目标：${c.goal}\n边界：${c.boundary||'尊重双方意愿'}\n该角色已知事实：${facts}`}).join('\n\n');return `# MIRU 可执行互动叙事提示词 | ${story.title}\n你是互动小说的叙事及角色演出模型，不是剧情规则裁判。规则引擎拥有最终状态写入权。\n\n## 故事与钩子\n${story.hook}\n世界：${p.world}\n核心矛盾：${p.conflict}\n玩家身份：${p.playerRole}\n玩家性格：${p.playerPersona||'玩家自主选择'}\n偏好：${p.vibe}\n\n## 角色（独立知情范围，不可串知）\n${roles}\n\n## 演出约束\n1. 每次输出符合当前场景、人物独立记忆、身份与人设；不替用户决定。\n2. 保留情感张力、动作、停顿、语气和心理描写；不重复空泛迎合。\n3. 允许拒绝、疏远和真实代价；用户说停止就尊重边界。\n4. 一次多角色事件明确标注说话人；NPC不得读取他人私有知识。\n5. 不新建事实、道具、权限或修改关系数值；只能提出候选结果交给引擎核验。\n6. 当前场景每轮对话在 minTurns 与 maxTurns 之间；故事选择改变节点才会推进主线。\n7. 回滚后不携带另一条时间线的记忆。旁观模式不将玩家写入场景。\n\n## 可执行剧情节点\n${story.nodes.map(n=>`${n.id} · ${n.title}：${(n.opening||[]).find(l=>l.speaker==='narrator')?.text.slice(0,120)||''}；分支：${n.choices.map(c=>c.text+'→'+c.next).join(' / ')}`).join('\n')}\n\n## 特殊互动触发器（意图词只是筛选，需经过条件校验）\n${rules||'没有开启特殊事件'}\n\n## 用户个性化补充\n${p.customPrompt||'无'}\n\n## 输出要求\n返回符合人设的对白、动作、潜台词，以及供引擎验证的候选事件；未经校验不得更改事实。`}
function promptForm(){return `<div class="sectionTitle">🧠 已自动帮你写好 Prompt</div><p class="small muted">每个创作者只需要描述故事。系统根据人物、世界、分支和互动规则编译结构化提示词。</p><textarea id="compiledPrompt" class="codeEdit" rows="17" readonly>${esc(compilePrompt())}</textarea><div class="row">${$btn('copy-prompt','⧉ 复制全部提示词','btn primary')}${$btn('download-prompt','⇩ 下载 Prompt','btn')}</div><div class="sectionTitle">你还想额外要求 AI 怎么写？</div>${field('附加写作规则（可选）','customPrompt','textarea','如：增加心理与动作描写；每个场景都有爽点；三位男主各自有不同动机')}
<div class="helpOverlay">高级系统提示词是从真实故事数据重新编译的。改角色、世界或触发器后，刷新本页即可更新。正式推理时仅传当前说话者有权获知的事实。</div></div>`}
function releaseForm(){const v=window.MiruValidate(getStory()),t=MT.validateRules(getStory().interactions,getStory());return `<div class="sectionTitle">发布前自检</div><div class="thinCard"><h4>${v.valid&&t.valid?'✅ 结构检查通过':'⚠️ 需要修复'}</h4><p>剧情错误 ${v.errors.length} 项 · 触发错误 ${t.errors.length} 项 · 提示 ${v.warnings.length+t.warnings.length} 项</p>${[...v.errors,...t.errors,...v.warnings,...t.warnings].slice(0,10).map(x=>`<p>· ${esc(x)}</p>`).join('')}</div><div class="helpOverlay">真实发布需要后端账号、素材存储、内容审核、版权/年龄政策及正式宝石结算。目前只提供可导出的本地作品与演示发布状态。</div>${$btn('publish','✓ 标记可演示发布','btn primary')}${$btn('export','⇩ 导出交给研发','btn')}`}
function eventsView(){const story=getStory(),rule=story.interactions;return `<div class="panelTop"><div><h2>⚡ 一句话安排互动</h2><p>只需选择想要的玩法，规则引擎自动检查场景、条件、冷却与次数。</p></div></div><div class="section"><div class="sectionTitle">添加到故事中</div><div class="triggerGroup">${D.INTERACTIONS.map(e=>`<button class="triggerQuick" data-add-interaction="${e.id}"><span>${e.icon}</span>${e.name}<small style="display:block;color:#b7acbf;margin-top:5px">${(p.interactionIds||[]).includes(e.id)?'✓ 已启用':'＋ 添加'}</small></button>`).join('')}</div><div class="sectionTitle" style="margin-top:25px">📍 当前触发配置（${rule.length} 条）</div>${rule.length?rule.map(r=>`<div class="thinCard"><div class="row"><h4 style="margin:0">${D.INTERACTIONS.find(i=>i.id===r.interaction)?.icon||'✦'} ${esc(r.id)} · ${esc(r.interaction)}</h4><span class="pill">${r.once?'只触发一次':'支持重复'}</span></div><p>${esc(r.when)} ${esc(r.scene||'所有场景')} ${r.choice?' · '+esc(r.choice):''} ${r.pattern?' · '+esc(r.pattern):''}</p><p>${esc(r.note)}</p></div>`).join(''):'<p class="small muted">未启用交互</p>'}${$btn('pro','⚙️ 进入高级触发器配置','btn primary')}${$btn('preview','▶ 去试玩这些互动','btn')}</div>`}
function sourceView(){return `<div class="panelTop"><div><h2>📚 Sourcebook · 世界记忆库</h2><p>定义世界规则与秘密；关键词只用于找资料，不直接绕过人物知识权限。</p></div>${$btn('source-add','＋ 新增资料','btn primary sm')}</div><div class="section"><div class="helpOverlay">示例：“夜市交易必须遵循等价原则” → 标签“夜市/交换”，仅在相关场景检索；角色没有获知这条资料，就不能直接在对话中引用。</div>${sourcebook.length?sourcebook.map((s,i)=>`<div class="thinCard"><div class="row"><h4>${esc(s.title)}</h4>${$btn('source-edit-'+i,'编辑','btn sm')}</div><p>${esc(s.detail)}</p><div class="tagGroup"><span class="tag">${esc(s.keywords)}</span><span class="tag">${esc(s.visibility)}</span></div></div>`).join(''):`<div class="thinCard"><h4>🔐 世界资料不等于所有角色都知道</h4><p>你还没有独立的资料条目。添加一条世界规则、场景机制或人物秘密吧。</p></div>`}</div>`}

async function askRemote(path,payload){if(!['http:','https:'].includes(location.protocol))return null;try{const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),14000);const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:ctl.signal});clearTimeout(timer);if(!r.ok)return null;return await r.json()}catch(_){return null}}
async function remoteGuideTurn(index){const answers=[...wizard.answers],storyId=p.id;const r=await askRemote('/api/guide-turn',{step:index,answers,project:p});if(r?.feedback&&storyId===p.id&&answers.join('|')===wizard.answers.join('|')){wizard.feedback[index]=String(r.feedback).slice(0,450);save();if(tab==='guide')render()}}
async function remoteOutline(){const answers=[...wizard.answers],storyId=p.id;const r=await askRemote('/api/plan',{answers,project:p});if(!r?.project||storyId!==p.id||answers.join('|')!==wizard.answers.join('|'))return;for(const field of ['title','premise','hook','conflict','world','vibe','ending'])if(typeof r.project[field]==='string'&&r.project[field].trim()&&r.project[field].length<1400)p[field]=r.project[field];if(r.project.lead&&typeof r.project.lead==='object'){for(const field of ['name','role','personality','goal','boundary'])if(typeof r.project.lead[field]==='string'&&r.project.lead[field].length<1000)p.lead[field]=r.project.lead[field]}save();makeEngine();if(tab==='guide'||tab==='draft')render();toast('✦ 已使用在线 AI 生成更细的故事内容')}
async function rewriteRemote(input,field){const r=await askRemote('/api/rewrite',{text:input,genre:p.genre,context:p.hook});return typeof r?.text==='string'&&r.text.trim()?r.text:rewrite(input)}
function cleanChoiceLabel(x){return x.replace(/^[^\p{L}\p{N}]+/u,'').trim()}
function fillGuideData(step,answer){const key=step.key,raw=String(answer||'').trim(),items=wizard.selections[key]||[],text=wizard.custom[key]||'';p.guided ||= {};p.guided[key]={answer:raw,selections:[...items],custom:text};
 switch(key){
 case 'concept':{if(raw){const t=D.chooseTemplate(D.detectTemplate(raw));p.templateId=t.id;p.premise=raw;p.title=raw.length<22?raw.slice(0,18):t.title;p.hook=t.hook;p.object=t.object}break}
 case 'genres':p.genres=items;p.genre=items.map(cleanChoiceLabel).join(' / ')||raw;break;
 case 'tone':p.toneTags=items;p.vibe=raw;break;
 case 'world':if(raw)p.world=raw;break;
 case 'identity':if(raw)p.playerRole=raw;break;
 case 'persona':if(raw)p.playerPersona=raw;break;
 case 'cast':{const n=Math.min(6,Math.max(2,parseInt(raw)||2));const extra=Math.max(0,n-2);p.extraCast=p.extraCast||[];while(p.extraCast.length<extra){const j=p.extraCast.length+3;const sample=[{name:'Nico',role:'情报中间人',personality:'玩世不恭，但从不说假话',goal:'查明十年前的失踪事件'},{name:'Mason',role:'家族继承对手',personality:'骄傲、缜密，对弱点保持戒心',goal:'在交易中保全自身的自由'},{name:'Ethan',role:'沉默的外部盟友',personality:'理智温和，但一直隐瞒旧伤',goal:'让被掩盖的真相重见天日'},{name:'Lucien',role:'不可预测的规则制定者',personality:'危险优雅，有明确底线',goal:'使一份不公正契约失效'}][j-3];p.extraCast.push({id:'actor_'+j,...sample,boundary:'同意与拒绝均有效，尊重个人边界'});}p.extraCast=p.extraCast.slice(0,extra);break}
 case 'lead':if(raw){const a=raw.split(/[｜|,，]/);p.lead.name=a[0].trim().slice(0,35)||p.lead.name;if(a[1])p.lead.role=a.slice(1).join(' ').trim()}break;
 case 'archetype':if(raw)p.lead.personality=raw;break;
 case 'relationships':if(raw)p.relationship=raw;break;
 case 'conflict':if(raw)p.conflict=raw;break;
 case 'secret':if(raw){p.secret=raw;const i=sourcebook.findIndex(s=>s.wizardKey==='secret');const entry={wizardKey:'secret',title:'核心秘密 · 编剧引导',keywords:'秘密|契约|真相',detail:raw,visibility:'support'};if(i>=0)sourcebook[i]=entry;else sourcebook.push(entry)}break;
 case 'opening':if(raw){p.hook=raw==='AI 帮我设计开场'?p.hook:raw+'。'+p.conflict.slice(0,55);};break;
 case 'chapters':p.chapterPlan=raw;p.sceneCount=raw.includes('10')?10:raw.includes('6')?6:raw.includes('3')?3:4;break;
 case 'branches':p.branchPolicy=items;break;
 case 'interactions':{const map={'来电':'call','私信':'message','照片':'photo','密码':'cipher','证据':'evidence','特效':'fx','音色':'call','骰':'evidence','日记':'message','投票':'message','礼物':'photo','手机':'cipher'};const ids=[...new Set(items.flatMap(x=>Object.entries(map).filter(([k])=>x.includes(k)).map(([,v])=>v)))];p.interactionIds=ids;p.advanced.rules=[];p.interactionExtras=items;break}

else if(modal.kind==='cipher'||modal.kind==='evidence'){const evidence=modal.kind==='evidence';content=`<h3>${evidence?'🧩 证据推理':'🔐 密码小游戏'}</h3><p>${evidence?'桌上有两份相互矛盾的记录。你会优先相信哪份可核验材料？':'旧钥匙上刻着线索：7、1、4。输入正确数字，才能打开暗格。'}</p>${evidence?`<div class="gameChoices">${$btn('game-pass','检查原始时间戳','btn')}${$btn('game-fail','相信没有署名的传闻','btn')}</div>`:`<div class="field"><input id="cipherInput" placeholder="请输入三位密码" maxlength="3" inputmode="numeric"></div>${$btn('game-check','解锁','btn primary full')}`}`}

else if(a==='pro-add-scene'){const i=(p.advanced.scenes||[]).length+1,id='custom_'+i;if(!p.advanced.scenes)p.advanced.scenes=[];p.advanced.scenes.push({id,title:'新场景 '+i,text:'这里发生一件改变命运的事。',choices:[{id:'to-final-'+i,text:'进入下一幕',next:'final'}]});currentScene=id;save();makeEngine();render();toast('新增场景已插入到专业时间线')}
else if(a==='pro-add-rule'){const ids=p.interactionIds||[];if(!ids.includes('message'))ids.push('message');p.advanced.rules=(p.advanced.rules?.length?p.advanced.rules: D.defaultRules(ids));p.advanced.rules.push({id:'author_rule_'+Date.now().toString().slice(-6),interaction:'message',when:'keyword',pattern:'短信|有人找我',scene:'*',once:true,cooldown:2,priority:10,note:'自定义来源规则'});save();render();toast('已添加一条可编辑的触发规则')}
else if(a==='pro-save-rules'){let rules;try{rules=JSON.parse(Q('#ruleJSON').value);if(!Array.isArray(rules))throw Error('必须是数组');const s=getStory();const check=MT.validateRules(rules,s);if(!check.valid)throw Error(check.errors[0]);p.advanced.rules=rules;p.interactionIds=[...new Set(rules.map(x=>x.interaction))];save();makeEngine();render();toast('已保存并通过触发器校验')}catch(e){toast('JSON 错误：'+e.message)}}
else if(a==='pro-save-node'){saveNode()}
else if(a==='pro-save-dialogue'){const backup=clone(p.advanced.scenes||[]);try{const n=getStory().nodes.find(n=>n.id===currentScene);if(!n)throw Error('找不到节点');let o=p.advanced.scenes.find(n=>n.id===currentScene);if(!o){o={id:currentScene};p.advanced.scenes.push(o)}for(const name of ['npcId','npcOrder','responseCards','watchLines','onEnter','demoChoice']){let v=Q('[data-beat="'+name+'"]')?.value||'';if(['responseCards','watchLines','onEnter'].includes(name))v=JSON.parse(v);if(name==='npcOrder')v=v.split(',').map(x=>x.trim()).filter(Boolean);if(name==='demoChoice'&&!v)continue;o[name]=v;}const valid=window.MiruValidate(getStory());if(!valid.valid)throw Error(valid.errors[0]);save();makeEngine();render();toast('已保存演出规则')}catch(e){p.advanced.scenes=backup;toast('检查回复卡/角色ID：'+e.message)}}
else if(a==='pro-save-choice-effects'){const original=clone(p.advanced.scenes||[]);try{const story=getStory(),n=story.nodes.find(x=>x.id===currentScene);if(!n)return toast('节点不存在');let o=p.advanced.scenes.find(x=>x.id===currentScene);if(!o){o={id:currentScene};p.advanced.scenes.push(o)}const mapped=clone(o.choices||n.choices);for(const c of mapped){const req=Q(`[data-req="${c.id}"]`),eff=Q(`[data-eff="${c.id}"]`);if(req)c.requires=JSON.parse(req.value);if(eff)c.effects=JSON.parse(eff.value);}o.choices=mapped;const v=window.MiruValidate(getStory());if(!v.valid)throw Error(v.errors[0]);save();makeEngine();render();toast('已保存条件和后果')}catch(e){p.advanced.scenes=original;toast('保存失败：'+e.message)}}
else if(a==='pro-add-choice'){const s=getStory();const node=s.nodes.find(n=>n.id===currentScene);if(!node)return;const newc={id:'choice_'+Date.now().toString().slice(-7),text:'做出新的决定',next:'final',effects:{flags:{new_decision:true}}};let o=(p.advanced.scenes||[]).find(n=>n.id===currentScene);if(!o){o={id:currentScene};p.advanced.scenes.push(o)}o.choices=clone(o.choices||node.choices);o.choices.push(newc);save();render()}
else if(a==='pro-validate'){const v=window.MiruValidate(getStory()),r=MT.validateRules(getStory().interactions,getStory());toast('校验：'+(v.errors.length+r.errors.length)+' 错误，'+(v.warnings.length+r.warnings.length)+' 提醒')}
else if(a==='publish'){if(!window.MiruValidate(getStory()).valid)return toast('请先通过结构校验');showModal('publish')}
else if(a==='publish-confirm'){p.published=true;save();closeModal();render();toast('已标记本地演示就绪（未上传服务器）')}
}
function saveNode(){const s=getStory(),n=s.nodes.find(x=>x.id===currentScene);if(!n)return;let o=(p.advanced.scenes||[]).find(x=>x.id===currentScene);if(!o){o={id:currentScene};p.advanced.scenes.push(o)}o.title=Q('[data-node-field="title"]').value;o.text=Q('[data-node-field="text"]').value;o.minTurns=Number(Q('[data-node-field="minTurns"]').value);o.maxTurns=Number(Q('[data-node-field="maxTurns"]').value);o.choices=clone(o.choices||n.choices);for(const c of o.choices){const t=document.querySelector(`[data-choice-text="${c.id}"]`),tar=document.querySelector(`[data-choice-target="${c.id}"]`);if(t)c.text=t.value;if(tar)c.next=tar.value}const valid=window.MiruValidate(getStory());if(!valid.valid){toast('保存失败：'+valid.errors[0]);return}save();makeEngine();render();toast('节点与分支已保存到统一故事数据')}
function voiceInput(){const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return toast('当前浏览器没有语音识别；可以直接打字，或用系统语音键盘。');try{const r=new S();r.lang='zh-CN';r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>{const t=e.results[0][0].transcript;const el=Q('#wizardText');if(el){el.value+=(el.value?' ':'')+t;wizardCustomUpdate(el.value)}toast('语音已输入，可继续编辑后发送')};r.onerror=e=>toast('语音输入未完成：'+e.error);r.start();toast('🎤 请开始说话…')}catch(e){toast('语音启动失败，请使用键盘输入')}}
function updateField(key,value){dirty=true;const path=key.split('.');if(path.length===1)p[key]=value;else {if(!p[path[0]])p[path[0]]={};p[path[0]][path[1]]=value}save()}
function importFile(file){const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result),project=o.project||o;if(!project?.lead||!project?.templateId)throw Error('需要 MIRU Creator v2 格式 project 字段');p=project;p.guided ||= {};sourcebook=o.sourcebook||[];wizard=o.wizard||{answers:[],step:0,complete:false,selections:{},custom:{},feedback:{}};wizard.selections ||= {};wizard.custom ||= {};wizard.answers ||= [];makeEngine();save();tab='draft';render();toast('导入成功，可在故事工作台修改')}catch(e){toast('导入失败：'+e.message)}};rd.readAsText(file)}
// Event delegation; preserve current form cursor by not rerendering on edits.
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.nav){menuOpen=false;setTab(target.dataset.nav);return}if(target.dataset.wizardOption){wizardOption(target.dataset.wizardOption);return}if(target.dataset.wizardJump!==undefined){wizard.step=Number(target.dataset.wizardJump);wizard.complete=false;save();render();window.scrollTo(0,0);return}if(target.dataset.proTab){proTab=target.dataset.proTab;render();return}if(target.dataset.action){handleAction(target.dataset.action);return}if(target.dataset.chip){wizardOption(target.dataset.chip);return}if(target.dataset.selectWork){openWork(target.dataset.selectWork);return}if(target.dataset.cloneWork){const w=shelf[target.dataset.cloneWork];if(w){const cp=clone(w.project);cp.id='work-'+Date.now();cp.title+='（副本）';cp.published=false;p=cp;wizard={answers:[],step:0,complete:false,feedback:{}};sourcebook=clone(w.sourcebook||[]);makeEngine();save();setTab('draft')}return}if(target.dataset.deleteWork){const id=target.dataset.deleteWork;if(!confirm('确定删除这份本地草稿？请先导出备份。'))return;delete shelf[id];if(id===p.id){const next=Object.keys(shelf)[0];if(next){p=clone(shelf[next].project);wizard=clone(shelf[next].wizard);sourcebook=clone(shelf[next].sourcebook||[])}else{p=D.defaultProject(D.chooseTemplate('open'));wizard={answers:[],step:0,complete:false,feedback:{}};sourcebook=[]}makeEngine()}save();render();return}if(target.dataset.filter){filter=target.dataset.filter;render();return}if(target.dataset.template){const t=D.chooseTemplate(target.dataset.template),balance=p.gemBalance;p=D.defaultProject(t);p.gemBalance=balance;wizard={answers:[],step:0,complete:false,selections:{},custom:{},feedback:{}};save();makeEngine();setTab('guide');toast('已选中「'+t.title+'」，继续用 AI 引导细化');return}if(target.dataset.draft){draftTab=target.dataset.draft;render();return}if(target.dataset.scene){currentScene=target.dataset.scene;proTab='graph';tab='pro';render();return}if(target.dataset.addInteraction){const id=target.dataset.addInteraction;const enabled=p.interactionIds.includes(id);p.interactionIds=enabled?p.interactionIds.filter(x=>x!==id):[...p.interactionIds,id];p.advanced.rules=[];save();makeEngine();render();toast(enabled?'已关闭 '+id:'已添加 '+id+' 并自动配置事件');return}if(target.dataset.asset){showModal('asset',target.dataset.asset);return}if(target.dataset.mode){if(!engine)return;try{engine.switchMode(target.dataset.mode);render()}catch(e){toast(e.message)}return}if(target.dataset.pick){if(!engine)return;try{const prior=engine.state.nodeId,choice=engine.node.choices.find(c=>c.id===target.dataset.pick);engine.choose(target.dataset.pick);render();procTriggers('choice',{choice:choice.id});if(prior!==engine.state.nodeId && !modal)procTriggers('scene_enter',{})}catch(err){toast(err.message)}return}if(target.dataset.tryEvent){showModal(target.dataset.tryEvent);return}if(target.dataset.choiceDelete){const s=getStory(),n=s.nodes.find(n=>n.id===currentScene);let o=p.advanced.scenes.find(n=>n.id===currentScene);if(!o){o={id:currentScene};p.advanced.scenes.push(o)}o.choices=clone(o.choices||n.choices).filter(c=>c.id!==target.dataset.choiceDelete);save();render()}});
document.addEventListener('input',e=>{if(e.target.dataset.wizardCustom)wizardCustomUpdate(e.target.value)});
document.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files?.[0])importFile(e.target.files[0]);if(e.target.id==='proChoiceScene'){currentScene=e.target.value;render();return}const key=e.target.dataset.pField;if(key){updateField(key,e.target.value); if(key==='title'||key==='premise')render()}const ef=e.target.dataset.extraField;if(ef){const [i,k]=ef.split('.');if(p.extraCast?.[Number(i)]){p.extraCast[Number(i)][k]=e.target.value;dirty=true;save()}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='wizardText'){e.preventDefault();wizardCommit()}else if(e.key==='Enter'&&e.target.id==='playInput'){e.preventDefault();handleAction('play-send')}});
makeEngine();render();
})();

</script></body></html>
